/* ============ DISCOVERY POP-UPS ============
   A reveal scene when you get a new soul, when one evolves, and the first time you reach an area or a new world.
   They wait until you're out of battle and nothing else is open. */
const SCENEQ=[];
function queueScene(o){ SCENEQ.push(o); }
function sceneBusy(){ return !!(B||travelling||document.querySelector(".overlay,.ask,.lady,.revealov,.cutin,.timing")); }
function flushScenes(){ if(!SCENEQ.length||sceneBusy()) return; showReveal(SCENEQ.shift()); }
setInterval(flushScenes,700);
// Catching a soul must never give away how (or whether) it evolves: no evolution names, conditions or counts.
function spoilerFree(sp,text){ const names=[]; const walk=k=>evoList(k).forEach(e=>{ if(SPECIES[e.to]&&!names.includes(SPECIES[e.to].n)){ names.push(SPECIES[e.to].n); walk(e.to); } }); walk(sp);
  return String(text).split(/(?<=[.!?])\s+/).filter(x=>!/evolv|metamorph/i.test(x)&&!names.some(n=>x.toLowerCase().includes(n.toLowerCase()))).join(" "); }
function showReveal(o){
  let kicker="",title="",sub="",text="",art="",col="#7fc4ff",extra="";
  if(o.kind==="soul"){ const sp=SPECIES[o.sp]; if(!sp) return; kicker="A new Companion"; title=sp.n; col=EL[sp.el].c; sub=`${EL[sp.el].name} · ${sp.r[0].toUpperCase()+sp.r.slice(1)}`; text=spoilerFree(o.sp,sp.lore||""); art=portrait(o.sp,"reveal",{sp:o.sp,tint:o.tint,nt:o.nt});
    extra=`<p class="meta">From ${esc(originOf(o.sp).n)}. It's yours now, resting until you add it to your team at a broken portal.</p>`; }
  else if(o.kind==="evo"){ const a=SPECIES[o.from], b2=SPECIES[o.to]; if(!a||!b2) return; kicker="Evolution"; title=b2.n; col=EL[b2.el].c; sub=`${a.n} became ${b2.n}`; text=b2.lore||"";
    art=`<div class="evopair">${portrait(o.from,"revealsm",{sp:o.from})}<span class="evoarrow">➜</span>${portrait(o.to,"reveal",{sp:o.to})}</div>`; }
  else if(o.kind==="quest"){ const q=QUESTS[o.id]; kicker="A new quest"; title=q.n; col="#ffe08a"; sub="Found while searching"; text=q.steps?q.steps[0].hint:q.hint; art=`<div class="portrait reveal" style="--c:#ffe08a"><span>📜</span></div>`; extra=`<p class="meta">Track it in the Codex under Quests.</p>`; }
  else if(o.kind==="clue"){ const sp=SPECIES[o.sp]; kicker=`${sp.n.split(" ")[0]}: a clue`; title=o.title; col="#ffe08a"; sub="Task complete"; text=o.text; art=portrait(o.sp,"reveal",{sp:o.sp}); }
  else if(o.kind==="prof"){ const P=PROFS[o.id]; kicker="A new trade"; title=P.n; col="#6fd6a0"; sub=P.tool?`You found a ${ITEMS[P.tool].n}`:"Discovered"; text=P.d; art=`<div class="portrait reveal" style="--c:#6fd6a0"><span>${P.ico}</span></div>`; extra=`<p class="meta">Find it under 🛠️ Crafts.</p>`; }
  else if(o.kind==="weapon"){ const w=W(o.id); kicker="A mythic weapon"; title=w.n; col="#ffb347"; sub=wtype(o.id).n; text=w.lore||w.d; art=`<div class="portrait reveal" style="--c:#ffb347"><span>${wIco(o.id)}</span></div>`;
    extra=w.skill&&MOVES[w.skill]?`<p class="meta">Signature skill: ${esc(MOVES[w.skill].n)}.</p>`:""; }
  else if(o.kind==="area"||o.kind==="world"){ const z=zoneOf(o.id), m=MAPN[o.id]||{}; if(!z&&o.id!=="town") return; kicker=o.kind==="world"?"A new world":"New place discovered"; title=nodeName(o.id); sub=nodeAddr(o.id);
    text=o.id==="town"?MAPN.town.d:z.d; col=o.kind==="world"?"#b69cff":"#7fc4ff"; art=`<div class="revealscene">${sceneHTML(o.id==="town"?"arena":o.id,`<img class="area-discovery" src="${areaAsset(o.id)}" alt="">`)}</div>`;
    extra=PORTAL_TXT[o.id]?`<p class="meta">${esc(PORTAL_TXT[o.id])}</p>`:""; }
  const ov=document.createElement("div"); ov.className="revealov "+o.kind; ov.style.setProperty("--rc",col);
  ov.innerHTML=`<div class="rin"><div class="rkick">${esc(kicker)}</div>${art}<h2>${esc(title)}</h2><div class="rsub">${esc(sub)}</div>${text?`<p>${esc(text)}</p>`:""}${extra}<button class="btn gold" id="rvGo">Continue</button></div>`;
  document.body.appendChild(ov); sfx(o.kind==="evo"?"seal":"win",.4); rumble("seal");
  const b=ov.querySelector("#rvGo"); b.focus(); b.onclick=()=>{ ov.classList.add("out"); setTimeout(()=>{ ov.remove(); flushScenes(); },260); };
}

/* ============ CONTENT PACKS ============
   Everything the world is made of can be added with one registerPack({...}) call, in this file or loaded from a server file later.
   A pack can contain any of:
     souls:      [[id,name,type,rarity,emoji,hp,atk,def,spd,utilityMove,lore], ...]
     moves:      {id:{n,el,t,p,...}}              items:     {id:{n,ico,d,cat,use,...}}
     weapons:    [[id,type,name,desc,rarity,skill,price,zone], ...]     weaponTypes: {id:{n,ico}}
     evolutions: {fromId:{to,lv,trig,...}}        stories:   {areaId:[chain,...]}      secrets: [{id,n,d,how}]
     professions:{id:{n,ico,tool,d}}              crafts:    [{id,prof,in:[itemIds],out,lv,n}]
     gather:     {fishing:{area:[[item,weight],...]}, mining:{...}, foraging:{...}}      toolSpots: {toolItem:[areas]} */
const PROFS={}, CRAFTS=[], GATHER={fishing:{},mining:{},foraging:{}}, TOOL_SPOTS={};
function registerPack(p){
  if(p.moves) Object.assign(MOVES,p.moves);
  if(p.items) Object.assign(ITEMS,p.items);
  if(p.weaponTypes) Object.assign(WEAPON_TYPES,p.weaponTypes);
  (p.weapons||[]).forEach(([id,t,n,d,r,skill,price,zone])=>{ WEAPONS[id]={t,n,d,r,price:r==="mythic"?0:price,...(skill?{skill}:{}),...(zone?{zone}:{}),...(r==="mythic"?{hidden:true,lore:d}:{})}; });
  (p.souls||[]).forEach(([id,n,el,r,art,hp,atk,def,spd,util,lore,spawnW])=>{ SPECIES[id]={id,n,el,r,art,hp,atk,def,spd,lore,kind:"soul",spawnW:(typeof spawnW==="number"?spawnW:undefined),moves:[BASIC[el]||"tackle",r==="common"?"tackle":(STRONG[el]||"tackle"),util||"harden",HIDDEN[el]||"tackle"]}; });
  if(p.evolutions) Object.assign(EVOS,p.evolutions);
  if(p.stories) Object.entries(p.stories).forEach(([a,list])=>{ CHAINS[a]=[...(CHAINS[a]||[]),...list]; });
  (p.secrets||[]).forEach(x=>{ if(!SECRET_BY[x.id]){ SECRETS.push({test:()=>false,...x}); SECRET_BY[x.id]=SECRETS[SECRETS.length-1]; } });
  if(p.professions) Object.assign(PROFS,p.professions);
  (p.crafts||[]).forEach(c=>CRAFTS.push(c));
  if(p.gather) Object.entries(p.gather).forEach(([k,v])=>Object.assign(GATHER[k]=GATHER[k]||{},v));
  if(p.toolSpots) Object.assign(TOOL_SPOTS,p.toolSpots);
}

/* ============ PROFESSION MINI-GAMES ============
   One small input layer (keyboard, touch buttons, controller) shared by every trade's mini-game.
   Keys: arrows / WASD for directions, Space / Enter / J for the action. Controller: stick or D-pad, A for the action. */
const MGI={left:0,right:0,up:0,down:0,action:0,edges:[]};
let MG_ON=false;
function mgKey(e,down){ if(!MG_ON) return; const k=e.key; const map={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right",ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down"," ":"action",Enter:"action",j:"action",J:"action",c:"action",C:"action",Escape:"back"};
  const b=map[k]; if(!b) return; e.preventDefault(); e.stopPropagation(); if(down&&!MGI[b]) MGI.edges.push(b); MGI[b]=down?1:0; }
const KEYHELD={}; window.addEventListener("keydown",e=>{KEYHELD[e.key]=true;},true); window.addEventListener("keyup",e=>{KEYHELD[e.key]=false;},true); window.addEventListener("blur",()=>{for(const k in KEYHELD)KEYHELD[k]=false;});
window.addEventListener("keydown",e=>mgKey(e,true),true); window.addEventListener("keyup",e=>mgKey(e,false),true);
let mgPadPrev={};
function mgPoll(){ const gp=[...(navigator.getGamepads?navigator.getGamepads():[])].find(g=>g&&g.connected); if(!gp) return;
  const bt=i=>!!(gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>.5)), ax=gp.axes||[];
  const st={left:bt(14)||ax[0]<-.5,right:bt(15)||ax[0]>.5,up:bt(12)||ax[1]<-.5,down:bt(13)||ax[1]>.5,action:bt(0)||bt(7),back:bt(1)};
  Object.entries(st).forEach(([k,v])=>{ if(v&&!mgPadPrev[k]) MGI.edges.push(k); if(v!==!!mgPadPrev[k]) MGI[k]=v?1:(MGI["t_"+k]?MGI[k]:0); }); mgPadPrev=st; }
function mgTouch(el){ el.querySelectorAll("[data-hold]").forEach(b=>{ const k=b.dataset.hold;
  const on=e=>{ e.preventDefault(); if(!MGI[k]) MGI.edges.push(k); MGI[k]=1; MGI["t_"+k]=1; b.classList.add("down"); }, off=e=>{ e.preventDefault(); MGI[k]=0; MGI["t_"+k]=0; b.classList.remove("down"); };
  b.addEventListener("pointerdown",on); b.addEventListener("pointerup",off); b.addEventListener("pointerleave",off); b.addEventListener("pointercancel",off); }); }
function mgStart(){ MG_ON=true; Object.keys(MGI).forEach(k=>{ if(k!=="edges") MGI[k]=0; }); MGI.edges=[]; mgPadPrev={}; try{ document.activeElement&&document.activeElement.blur(); }catch(e){} }
function mgStop(){ MG_ON=false; MGI.edges=[]; }
function mgEdge(k){ const i=MGI.edges.indexOf(k); if(i>=0){ MGI.edges.splice(i,1); return true; } return false; }
const mgPads=(dirs)=>`<div class="mgpad">${dirs.includes("left")?'<button class="mgb" data-hold="left">◀</button>':""}${dirs.includes("up")?'<button class="mgb" data-hold="up">▲</button>':""}${dirs.includes("down")?'<button class="mgb" data-hold="down">▼</button>':""}<button class="mgb act" data-hold="action">${dirs.actLabel||"●"}</button>${dirs.includes("right")?'<button class="mgb" data-hold="right">▶</button>':""}</div>`;
function mgOverlay(title,html){ const o=document.createElement("div"); o.className="overlay mgov"; o.innerHTML=`<div class="rbox mgbox"><h3 style="margin:0 0 6px">${title}</h3>${html}</div>`; document.body.appendChild(o); mgTouch(o); return o; }
function mgLoop(step){ return new Promise(res=>{ let last=performance.now(); const tick=now=>{ mgPoll(); const dt=Math.min(.05,(now-last)/1000); last=now; const r=step(dt,now); if(r!==undefined){ res(r); return; } requestAnimationFrame(tick); }; requestAnimationFrame(tick); }); }

/* Echo Memory: a Companion remembers a moment. Four glyphs flash in order; repeat them.
   Pad: D-pad / stick. M&KB: arrows / WASD, or click the glyphs. Bond rises with every clean echo. */
const ECHO_DIRS=["up","right","down","left"], ECHO_ARROW={up:"▲",right:"▶",down:"▼",left:"◀"};
function echoToday(){ return new Date().toISOString().slice(0,10); }
function echoCan(m){ return (m.echoDay||"")!==echoToday(); }
function bondLevel(m){ const b=m.bond||0; return b>=30?4:b>=18?3:b>=9?2:b>=3?1:0; }
const BOND_NAMES=["","Familiar","Trusted","Kindred","Soulbound"];
async function echoMemory(u){
  const m=S.mons.find(x=>x.u===u); if(!m) return; const s=SPECIES[m.sp]; if(!s) return;
  if(!echoCan(m)){ toast(`${s.n} has already shared a memory today.`); return; }
  const len=Math.min(6,3+bondLevel(m)), seq=Array.from({length:len},()=>pick(ECHO_DIRS)), col=(EL[s.el]||{}).c||"#7fc4ff";
  let gained=0;
  if(SET.autoEcho){ gained=len; }
  else {
    mgStart();
    const o=mgOverlay(`✦ Echo Memory · ${esc(s.n)}`,`<p class="meta" style="margin:0 0 8px">${esc(s.n)} remembers something. Watch the glyphs, then echo them back.</p>
      <div class="echoring" style="--ec:${col}">${portrait(m.sp,"",m)}<div class="echoglyphs">${ECHO_DIRS.map(d=>`<button class="eg eg-${d}" data-hold="${d}">${ECHO_ARROW[d]}</button>`).join("")}</div></div>
      <div class="echoslots" id="echoSlots">${seq.map(()=>"<i></i>").join("")}</div>
      <p class="meta" id="echoStatus">Watch…</p><p class="meta" style="font-size:.78rem">Keys: arrows / WASD · Controller: D-pad or stick · or click the glyphs.</p>`);
    const glyph=d=>o.querySelector(".eg-"+d), slots=[...o.querySelectorAll("#echoSlots i")], status=o.querySelector("#echoStatus");
    const flash=async(d,ms)=>{ const g=glyph(d); g.classList.add("lit"); sfx("tick",.25); await wait(ms); g.classList.remove("lit"); await wait(120); };
    await wait(500); for(const d of seq) await flash(d,SET.fast?300:420);
    status.textContent="Echo it back."; MGI.edges=[];
    let i=0, wrong=0;
    await mgLoop(dt=>{ for(const d of ECHO_DIRS){ if(mgEdge(d)){ const g=glyph(d); g.classList.add("lit"); setTimeout(()=>g.classList.remove("lit"),160);
        if(d===seq[i]){ slots[i].className="ok"; gained++; i++; sfx("tick",.3); } else { slots[i].className="bad"; wrong++; i++; sfx("guard",.3); }
        if(i>=seq.length) return true; } } });
    mgStop();
    const clean=wrong===0; status.textContent=clean?"A perfect echo.":gained>=Math.ceil(seq.length/2)?"Close enough. The memory holds.":"The memory slips… for now.";
    o.querySelector(".echoring").classList.add(clean?"perf":gained?"good":"miss"); if(clean){ sfx("perfect",.5); rumble("perfect"); perfectPulse(); chime(s.el); } else sfx("tick",.3);
    await wait(900); o.remove();
  }
  const before=bondLevel(m); m.bond=(m.bond||0)+gained; m.echoDay=echoToday(); saveSoon();
  const after=bondLevel(m);
  if(after>before){ fxReward("✦",`${s.n} · ${BOND_NAMES[after]}`); toast(`${s.n} feels closer to you. Bond: ${BOND_NAMES[after]}.`); if(!S.seen[s.id]) S.seen[s.id]=true; if(after>=2&&typeof addCodex==="function") try{ addCodex("comp:"+s.id); }catch(e){} }
  if(after>before&&after===3) setTimeout(()=>toast(`${s.n} shared a memory with you. It's in the Codex.`),1400);
  if(after>before&&after===4){ oathKey(s.el); setTimeout(()=>toast(`${s.n} swears an Oath to you. It can use ${MOVES[oathKey(s.el)].n} once per fight.`),1400); S.codexNew=true; }
  else toast(gained?`${s.n} shares a memory. Bond +${gained}.`:`${s.n} isn't ready to share yet.`);
  render();
}

/* Bond payoffs. Kindred (bond 3): the companion shows you a memory, written into its Codex page.
   Soulbound (bond 4): it swears an Oath — a signature move it can use once per fight. No new controls:
   the Oath sits in the companion's Energy list like any other move. */
const KINDRED_HERO={
 voth:"Voth shows you a training yard on a world that no longer exists, and a much smaller Voth getting knocked down by everyone in it. Getting up again, every time. She doesn't say who taught her that. She doesn't have to.",

const KINDRED_EL={
 fire:"remembers the first spark it ever made, and how it spent the whole night trying to make a second one.",

function kindredMemory(sp){ const s=SPECIES[sp]; if(!s) return ""; const h=KINDRED_HERO[({voth2:"voth",beast_awakened:"beast",tibrsbear:"tibrs"})[sp]||sp]; if(h) return h; return `${s.n} ${KINDRED_EL[typeId(s.el)]||"remembers something it can't find the words for yet."}`; }
function oathKey(el){ const id=typeId(el); if(!id||!TYPES[id]) return null; const k="oath_"+id; if(!MOVES[k]) MOVES[k]={n:`${TYPES[id].name} Oath`,el:id,t:"dmg",p:84,tag:"Soulbound · once per fight",oath:true}; return k; }
function bondLevelOf(sp){ return Math.max(0,...(S.mons||[]).filter(m=>m.sp===sp).map(bondLevel)); }
// Bond pays off in battle: closer companions start with a little more essence in the pool.
function bondEssence(){ return Math.min(20,teamMons().reduce((a,m)=>a+bondLevel(m)*2,0)); }

/* Fishing: hold the direction the fish pulls + hold Reel until the catch bar fills. Let the line go slack or pull the wrong way and it escapes. */
async function mgFishing(fish){ mgStart(); const rare=/gold|void/.test(fish)?1:0, lv=profLv("fishing"); let dir=Math.random()<.5?-1:1, switchIn=1, prog=0, esc=0, pos=50;
  const o=mgOverlay("🎣 Reel it in!",`<div class="fishscene">${sceneHTML(S.loc,`<div class="mgfish" id="mgF">${ART_ICON.minnow?artTag(ART_ICON.minnow,"mgico"):"🐟"}</div>`,"water")}</div>
    <div class="mgpull" id="mgPull"></div><div class="mgbars"><label>Catch<div class="bar"><i id="mgP" style="width:0%"></i></div></label><label>Line strain<div class="bar strain"><i id="mgE" style="width:0%"></i></div></label></div>
    <p class="meta">Hold the direction the fish is pulling <b>and</b> hold Reel. Keys: ← → + Space · Controller: stick + A.</p>${mgPads(Object.assign(["left","right"],{actLabel:"Reel"}))}`);
  const r=await mgLoop(dt=>{ switchIn-=dt; if(switchIn<=0){ dir=-dir; switchIn=(rare?.55:.9)+Math.random()*(rare?.7:1.1); }
    const want=dir<0?"left":"right", other=dir<0?"right":"left", good=MGI.action&&MGI[want]&&!MGI[other];
    if(good) prog+=dt*(22+lv*.6-rare*6); else if(MGI.action){ esc+=dt*(30+rare*14-lv*.3); prog=Math.max(0,prog-dt*6); } else { esc+=dt*(9+rare*5); prog=Math.max(0,prog-dt*10); }
    esc=Math.max(0,esc-(good?dt*6:0)); pos=Math.max(8,Math.min(92,pos+dir*dt*(good?8:26)));
    const F=o.querySelector("#mgF"); if(F){ F.style.left=pos+"%"; F.style.transform=`translateX(-50%) scaleX(${dir<0?1:-1})`; }
    o.querySelector("#mgPull").innerHTML=`<b>${dir<0?"◀◀ Pulling left":"Pulling right ▶▶"}</b>`; o.querySelector("#mgP").style.width=Math.min(100,prog)+"%"; o.querySelector("#mgE").style.width=Math.min(100,esc)+"%";
    if(prog>=100) return true; if(esc>=100) return false; });
  mgStop(); o.remove(); return r; }

    <div class="mgstrikes" id="mgS"></div><p class="meta">${hint} Keys: Space · Controller: A.</p>${mgPads(Object.assign([],{actLabel:icon}))}`);

/* Brewing: arrows slide toward the line; press each direction as it arrives, in rhythm. */
async function mgRhythm(len){ mgStart(); const lv=profLv("brewing"), dirs=["up","right","down","left"], ico={up:"▲",right:"▶",down:"▼",left:"◀"};
  const beat=.62, speed=1/1.6, win=.12+lv*.004; const notes=Array.from({length:len},(_,i)=>({d:pick(dirs),t:1.4+i*beat,res:null})); let t=0;
  const o=mgOverlay("🧪 Stir in rhythm",`<div class="mglane" id="mgL"><div class="mgline"></div></div><p class="meta">Press each arrow as it reaches the line. Keys: arrows / WASD · Controller: D-pad or stick.</p>${mgPads(Object.assign(["left","up","down","right"],{actLabel:"🫕"}))}`);
  const lane=o.querySelector("#mgL");
  const r=await mgLoop(dt=>{ t+=dt; const due=notes.find(n=>n.res===null);
    dirs.forEach(d=>{ if(mgEdge(d)&&due){ const off=Math.abs(t-due.t); if(off<=win*2.2){ due.res=(d===due.d&&off<=win*1.1)?"perf":(d===due.d?"ok":"miss"); sfx(due.res==="miss"?"miss":"tick",.35); } } });
    notes.forEach(n=>{ if(n.res===null&&t-n.t>win*2.2){ n.res="miss"; } });
    lane.innerHTML=`<div class="mgline"></div>`+notes.map(n=>{ const x=20+(n.t-t)*speed*100; if(x<-10||x>110) return ""; return `<span class="mgnote ${n.res||""}" style="left:${x}%">${ico[n.d]}</span>`; }).join("");
    if(notes.every(n=>n.res!==null)){ const good=notes.filter(n=>n.res!=="miss").length; return {ok:good/len>=.7,score:good,len,perfect:notes.every(n=>n.res==="perf")}; } });
  await new Promise(r2=>setTimeout(r2,300)); mgStop(); o.remove(); return r; }

const COMP_TASKS_ON=false;   // companion origin tasks are paused for now; flip to true to bring them back
function ctState(sp){ S.ctask=S.ctask||{}; S.ctask[sp]=S.ctask[sp]||{done:{},wins:0,night:0,last:0,use:{},visit:{}}; return S.ctask[sp]; }
function ctMet(sp,t,st){ const r=t[3]; if(r.wins) return st.wins>=r.wins; if(r.night) return st.night>=r.night; if(r.last) return st.last>=r.last; if(r.visit) return !!st.visit[r.visit];
  if(r.use) return Object.entries(r.use).every(([k,n])=>(st.use[k]||0)>=n); return false; }
function ctProgress(sp,t,st){ const r=t[3]; if(r.wins) return `${Math.min(st.wins,r.wins)}/${r.wins}`; if(r.use){ const [k,n]=Object.entries(r.use)[0]; return `${Math.min(st.use[k]||0,n)}/${n}`; } return ctMet(sp,t,st)?"done":"not yet"; }
function ctCheck(sp){ if(!COMP_TASKS_ON) return; const list=COMP_TASKS[sp]; if(!list) return; const st=ctState(sp);
  list.forEach(t=>{ if(st.done[t[0]]||!ctMet(sp,t,st)) return; st.done[t[0]]=Date.now(); const rw=t[5]||{};
    if(rw.coins) earn(rw.coins,"quest"); if(rw.item) giveItem(rw.item); if(rw.title&&SECRET_BY[rw.title]) earnSecret(rw.title,true);
    queueScene({kind:"clue",sp,title:t[1],text:t[4]}); }); saveSoon(); }
function ctTeam(){ if(!COMP_TASKS_ON) return []; return teamMons().map(m=>m.sp).filter(sp=>COMP_TASKS[sp]); }
function companionTasksHTML(sp){ const list=COMP_TASKS[sp]; if(!list) return ""; const st=ctState(sp);
  return list.map(t=>`<div class="ctask ${st.done[t[0]]?"done":""}"><b>${st.done[t[0]]?"✓":"○"} ${esc(t[1])}</b> <small class="meta">${esc(ctProgress(sp,t,st))}</small><div class="meta">${esc(t[2])}</div>${st.done[t[0]]?`<div class="clue">“${esc(t[4])}”</div>`:""}</div>`).join(""); }
function openCompTasks(sp){ const o=document.createElement("div"); o.className="ask"; o.innerHTML=`<div class="in" style="text-align:left;max-width:520px"><b>${esc(SPECIES[sp].n)}: personal tasks</b><p class="meta" style="margin:4px 0 8px">Finish them to learn where ${esc(SPECIES[sp].n.split(" ")[0])} came from.</p>${companionTasksHTML(sp)}<div class="row"><button class="btn" data-no>Close</button></div></div>`;
  document.body.appendChild(o); o.querySelector("[data-no]").onclick=()=>o.remove(); }

registerPack({souls:[["seren", "Seren the Uncrowned", "light", "legendary", "✦", 68, 18, 16, 17, "harden", "She left a palace with a borrowed name and a song she could no longer sing. Now she listens at empty doors until something on the other side remembers the tune."], ["cael", "Cael the Burdened", "metal", "legendary", "✦", 90, 28, 16, 15, "harden", "He carries a blade too heavy for an ordinary life and hears names nobody else can hear. In the space between worlds, he is learning which voices belong to the dead—and which belong to him."], ["soren", "Soren Ashlion", "lightning", "rare", "✦", 78, 25, 16, 21, "harden", "He used to count every heartbeat before pulling the trigger in his sword. Since crossing the Rift, there is always one extra beat. He has begun leaving room for it."], ["axiom", "Axiom-7", "metal", "rare", "✦", 82, 23, 21, 14, "harden", "Built to rescue people from machines, it learned too well how machines can hurt. Each borrowed weapon is stored beside a promise to find another use for it."], ["veyra", "Veyra Fleetquill", "wind", "rare", "✦", 65, 21, 12, 29, "harden", "A courier from a coast where roads curled above the sea. She still keeps one bright ring on a cord, although she will not say why dropping it frightens her."], ["bram", "Bram Coppercap", "earth", "uncommon", "✦", 91, 21, 22, 12, "harden", "A repairman who has followed too many broken pipes into impossible kingdoms. He taps every low ceiling before walking beneath it, then smiles as though expecting a gift."], ["rowan", "Rowan Everlast", "spirit", "legendary", "✦", 88, 26, 18, 16, "harden", "He has outlived the names on his sword and the hands that taught him to hold it. Thunder sometimes follows him indoors. He apologizes before drawing the blade."], ["mossbell", "Mossbell", "sound", "common", "✦", 68, 17, 20, 13, "harden", "A little moss-covered bell that rings for paths nobody has walked yet. Travelers who follow it often arrive somewhere they did not know they missed."], ["orrix", "Orrix the Small Moon", "gravity", "legendary", "✦", 102, 20, 25, 8, "harden", "It collects things that fall upward. The stone above its back is not a pet or a weapon; it is the last piece of a sky that trusted it."], ["vesper", "Vesper Inkwing", "shadow", "uncommon", "✦", 59, 26, 11, 24, "harden", "Folded from a letter that was never delivered, it searches faces for a name the rain erased. Its wings rustle most softly beside people who are waiting."], ["kilnfang", "Kilnfang", "fire", "rare", "✦", 115, 25, 21, 10, "harden", "Someone left a toy beside an unattended kiln. By morning the toy was gone, and something enormous was keeping the abandoned workshop warm."], ["nullprior", "The Null Prior", "dark", "legendary", "✦", 84, 29, 15, 17, "harden", "A faceless keeper of doors that should never be opened. Its sermons remove sound, but the congregation always hears its own name."], ["brasswidow", "Brass Widow", "metal", "rare", "✦", 88, 24, 23, 20, "harden", "It still guards a clockmaker’s workshop that no longer exists. Every stolen gear goes into a careful pile beside the place where the workbench stood."], ["reedkip", "Reedkip", "water", "common", "✦", 46, 13, 11, 18, "harden", "It weaves a little raft every evening, then sleeps beside it on the bank. Nobody has seen what it is waiting to ferry across."], ["cinderpip", "Cinderpip", "fire", "common", "✦", 41, 16, 9, 21, "harden", "The first bird to sing after a forest fire. Its song is all the notes the flames could not burn."], ["hingeling", "Hingeling", "metal", "common", "✦", 59, 14, 19, 8, "harden", "When a door is forgotten, its hinge sometimes walks away. This one still turns toward every knock."], ["saltlick", "Saltlick", "earth", "common", "✦", 61, 15, 18, 10, "harden", "It licks the salt from old travelers’ boots. Sometimes it follows the taste of a road that vanished centuries ago."], ["inksnout", "Inksnout", "poison", "uncommon", "✦", 63, 21, 13, 19, "harden", "It eats spilled ink and leaves the paper clean. The stories it swallows return in its dreams, and sometimes in its bite."], ["palinode", "Palinode", "time", "mythic", "✦", 128, 29, 23, 23, "harden", "Its hourglass contains the second before a promise was broken. Each time it turns, someone far away almost remembers another life."], ["velmora", "Velmora, the Dream Orchard", "dream", "mythic", "✦", 119, 31, 22, 20, "harden", "The fruit in its antlers is never ripe. Each pale moon holds a dream its maker was too afraid to finish."], ["astergrave", "Astergrave", "cosmic", "mythic", "✦", 151, 30, 31, 9, "harden", "An observatory fell into the sea between worlds. Something beneath it kept watching the stars until the building learned to walk."], ["nacresovereign", "Nacre Sovereign", "water", "mythic", "✦", 139, 32, 26, 14, "harden", "A throne survived the drowning of its kingdom. The sea grew a monarch around it, and the empty streets still bow when it passes."]]});

  if(t>0&&S===save&&awayState()===st&&st.seen===seen&&!awayBusy&&!document.hidden&&Date.now()-awayLastInput<AWAY_MIN_MS){st.seen=Math.max(st.seen||0,t);saveSoon();}}

/* ============ EVOLUTION RULES ============
   Every evolution needs a condition (place, night, energy use, bond, hardship...). Level is only a minimum.
   Any evolution accidentally marked "level" is turned into a bond requirement so it can't happen just by levelling. */
(function(){ Object.keys(EVOS).forEach(k=>evoList(k).forEach(e=>{
  if(!e.trig||e.trig==="level"){ e.trig="bond"; e.n=e.n||10; e.hint=`Win ${e.n} fights together, then reach Lv ${e.lv}.`; }
  if(e.trig==="energy"&&e.el){ const nm=(TYPES[typeId(e.el)]||{}).name; if(nm) e.hint=e.hint.replace(/\b(Ember|Tide|Grove|Storm|Stone|Void)\b(?= moves)/,nm); }
})); })();

/* ============ TYPE RENAME LAYER ============
   Maps the old Keeper energies onto the new types, so older content and saves keep working. */
const OLD_ENERGY={Chronal:"time",Quantum:"gravity",Aetherial:"cosmic",Celestial:"light",NEXUS:"void","Soul Essence":"spirit",Psionic:"mind",Alchemy:"poison",Spirit:"metal"};
function typeName(id){ return (TYPES[id]||{}).name||id; }
function renameEnergy(n){ return OLD_ENERGY[n]?typeName(OLD_ENERGY[n]):n; }
(function(){
  // ability tags ("Chronal · Time" -> "Time")
  Object.values(MOVES).forEach(m=>{ if(!m.tag) return; const [a,...rest]=m.tag.split(" · "); if(OLD_ENERGY[a]){ const nm=typeName(OLD_ENERGY[a]); const r=rest.join(" · "); m.tag=nm+(r&&r!==nm&&r!=="Time"?" · "+r:""); } });
  // an Attack for every type
  Object.keys(TYPES).forEach(id=>{ if(!MOVES["atk_"+id]) MOVES["atk_"+id]={n:"Attack",el:id,t:"dmg",p:36}; if(typeof REGULAR!=="undefined") REGULAR.add("atk_"+id); });
  // skill tables keyed by type name
  const remapKeys=o=>{ Object.keys(o).forEach(k=>{ if(OLD_ENERGY[k]){ const nk=renameEnergy(k); o[nk]={...(o[nk]||{}),...o[k]}; delete o[k]; } }); };
  remapKeys(SKILL_TEACH);
  Object.keys(MAJOR).forEach(a=>MAJOR[a]=MAJOR[a].map(renameEnergy));
  Object.values(CHAINS).flat().forEach(ch=>Object.values(ch.scenes).forEach(sc=>(sc.c||[]).forEach(c=>{ if(c.req&&c.req.skill){ const n={}; Object.entries(c.req.skill).forEach(([k,v])=>n[renameEnergy(k)]=v); c.req.skill=n; c.l=c.l.replace(/\((\w[\w ]*) (\d+)\)/,(m,k,v)=>`(${renameEnergy(k)} ${v})`); } })));
  ENERGIES.splice(0,ENERGIES.length,...Object.values(TYPES).map(t=>t.name));
  Object.keys(ENERGY_C).forEach(k=>delete ENERGY_C[k]); Object.values(TYPES).forEach(t=>ENERGY_C[t.name]=t.c);
  Object.keys(GOVERNS).forEach(k=>{ if(OLD_ENERGY[k]||k==="Shadow") delete GOVERNS[k]; }); Object.values(TYPES).forEach(t=>GOVERNS[t.name]=t.gov); GOVERNS.Stealth="Swiftness";
  SKILLS.splice(0,SKILLS.length,...ENERGIES,"Soulcraft","Barter","Stealth","Lantern","Mentor");
})();

  Object.entries(S.skills).forEach(([k,v])=>{ const nk=k==="Shadow"&&!S.skills.Stealth&&!S.st.typesV2?"Stealth":renameEnergy(k); if(!out[nk]||out[nk].lv<v.lv) out[nk]=v; });
  SKILLS.forEach(k=>{ if(!out[k]) out[k]={lv:k==="Lantern"?0:5,xp:0}; }); S.skills=out; S.st.typesV2=true; }
