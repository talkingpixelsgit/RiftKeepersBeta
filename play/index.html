<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#05080f">
<meta name="application-name" content="Rift Keepers">
<meta name="author" content="Talking Pixels Studios">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rift Keepers">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Time Keepers Prequel - Rift Keepers Alpha</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --ink:#05080f; --deep:#0a1120; --panel:#0f1a2e; --raise:#16253f; --line:#223756;
  --ink:#05080f; --deep:#080d1a; --panel:#0b1324; --raise:#122036; --line:#25416b; --hair:rgba(127,196,255,.35);
  --text:#eef4fc; --muted:#93a7c4; --gold:#7fc4ff; --gold-dim:#3e6d9e; --bad:#ef6f6f; --good:#6fd6a0;
  --white:#f4f8fd; --ice:#cfe6ff; --paper:#e9f0f8; --paper-ink:#0d1a2c; --treasure:#e9c46a; --blue:#4f9fe8;
  --ember:#ef7b45; --tide:#4aa3e8; --grove:#6cc070; --storm:#c9b3ff; --stone:#c2a27a; --void:#9a6bd6;
  --r-sm:6px; --r-md:12px;
  --display:"Alegreya Sans SC", "Trebuchet MS", system-ui, sans-serif;
  --body:"Alegreya Sans", "Segoe UI", system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--ink);color:var(--text);font:16px/1.45 var(--body)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;letter-spacing:.01em}
.app{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;height:100%}
/* sidebar */
.side{background:linear-gradient(180deg,#0b1426,#060a14);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 10px;font-family:var(--display);font-size:1.5rem;font-weight:800;color:var(--white);text-shadow:0 0 18px rgba(127,196,255,.55);letter-spacing:.06em}
.brand small{display:block;font:500 .8rem var(--body);color:var(--muted);letter-spacing:.04em;text-shadow:none}
.brandtk{display:block;font:700 .72rem var(--display);letter-spacing:.32em;color:var(--gold);text-transform:uppercase;text-shadow:none}
.tamer{margin:4px 12px 12px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel)}
.tamer .h{font-weight:700;font-size:1.05rem}
.bar{height:6px;border-radius:3px;background:#0b1428;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#4f9fe8,#bfe3ff);transition:width .4s}
.wallet{display:flex;gap:14px;color:var(--muted);font-size:.92rem}
.wallet b{color:var(--text)}
.nav{display:flex;flex-direction:column;padding:4px 8px;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;border-radius:var(--r-sm);padding:10px 12px;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(79,159,232,.22),transparent);color:var(--white);box-shadow:inset 3px 0 0 var(--gold)}
.nav .ico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#101d33;border:1px solid #243a5c;font-size:14px}
.nav button[aria-current="page"] .ico{border-color:var(--gold);box-shadow:0 0 10px rgba(127,196,255,.45)}
.nav button:hover{color:var(--text)}
.nav .ico{width:22px;text-align:center}
.side .foot{margin-top:auto;padding:12px 16px;color:var(--muted);font-size:.8rem}
/* main */
main{overflow:auto;min-height:0;padding:22px 26px 40px}
.view-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.view-h.compact{margin-bottom:8px}
.view-h.compact h2{display:flex;align-items:center;gap:8px}
.hinfo{padding:0 6px;font-size:.9rem;color:var(--muted);border-radius:50%;line-height:1.4}
.view-h h2{font-size:1.7rem}
.view-h h2{font-size:1.7rem;position:relative;padding-bottom:6px}
.view-h h2::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 8' preserveAspectRatio='none'><path d='M0 6 H60 l8 -5 l10 7 l8 -5 H400' fill='none' stroke='%237fc4ff' stroke-width='1.2' opacity='.75'/></svg>") left bottom/100% 8px no-repeat}
.view-h p{margin:0;color:var(--muted)}
/* social rail */
.social{background:linear-gradient(180deg,#0b1426,#060a14);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.social h3{font-size:1rem;padding:14px 16px 6px;color:var(--muted)}
.online{padding:0 12px 8px;display:flex;flex-direction:column;gap:4px;max-height:34%;overflow:auto}
.peer{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:var(--r-sm);background:var(--panel);font-size:.9rem}
.peer .dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.peer .doing{color:var(--muted);font-size:.8rem;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.chat{flex:1;overflow:auto;padding:4px 14px;display:flex;flex-direction:column;gap:6px;min-height:0}
.msg{font-size:.92rem;word-wrap:break-word}
.ttl{display:block;color:var(--gold);font-size:.72rem;font-style:italic;opacity:.9;font-weight:400}
.msg .ttl{display:inline;margin:0 6px 0 2px}
.msg.adm{color:var(--gold);font-weight:600}
.newdot{color:var(--gold);font-size:.8em}
.admin-sec{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:14px;margin:0 0 14px}
.admin-sec{border:1px solid var(--line);border-radius:var(--r-md);background:linear-gradient(180deg,rgba(255,255,255,.02),transparent 40%),var(--panel);padding:14px;margin:0 0 14px;box-shadow:inset 0 0 0 1px rgba(127,196,255,.06),0 6px 22px rgba(0,0,0,.35)}
.admin-sec h3{position:relative;padding-bottom:4px;border-bottom:1px solid var(--hair);margin-bottom:10px}
.admin-sec h3{margin:0 0 4px}
.admin-sec .meta{color:var(--muted);font-size:.82rem}
.arow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.arow label{font-size:.85rem;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.arow input,.arow select{background:var(--ink);color:var(--text);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 8px;font:inherit;min-width:0}
.arow input[type=number]{width:84px}
.adm-table{width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px}
.adm-table td,.adm-table th{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.adm-scroll{overflow-x:auto;max-height:340px;overflow-y:auto}
.msg .who{font-weight:700;margin-right:6px}
.msg.sys{color:var(--gold);font-style:italic}
.chatform{display:flex;gap:6px;padding:10px 12px;border-top:1px solid var(--line)}
.chatform input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);padding:8px 10px;font:inherit}
.empty{color:var(--muted);font-size:.9rem;padding:6px 2px}
/* shared bits */
.btn{background:linear-gradient(180deg,#172a47,#0f1c31);border:1px solid #2c4468;border-radius:8px;padding:9px 14px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .15s,box-shadow .15s,transform .08s}
.btn{background:linear-gradient(180deg,#111d33,#0a1426);border:1px solid #2c4a78;border-radius:8px;padding:9px 14px;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.06);transition:border-color .15s,box-shadow .15s,transform .08s}
.btn:hover{border-color:#5aa9ff;box-shadow:0 0 0 1px rgba(90,169,255,.3),inset 0 1px 0 rgba(255,255,255,.08)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.gold{background:linear-gradient(180deg,#9ad3ff,#4f9fe8);color:#04101f;border-color:#8fcaff;box-shadow:0 2px 12px rgba(79,159,232,.35),inset 0 1px 0 rgba(255,255,255,.5)}
.btn.gold:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:1px 7px;border-radius:9px;background:#0b1428;border:1px solid currentColor}
.r-common{color:#aab6cc}.r-rare{color:#5fb3ff}.r-epic{color:#c38bff}.r-legendary{color:var(--gold)}
.portrait{--c:var(--muted);width:72px;height:72px;border-radius:50%;display:grid;place-items:center;font-size:40px;flex:none;
  background:radial-gradient(circle at 35% 30%, color-mix(in srgb,var(--c) 70%,white 10%), color-mix(in srgb,var(--c) 35%,#0a1222) 70%);
  box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 60%,transparent), inset 0 -8px 14px rgba(0,0,0,.35)}
.portrait.sil{filter:brightness(0) opacity(.55)}
.grid{display:grid;gap:12px}
/* zones */
.zones{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.zone{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
.zone .art{height:110px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:34px;position:relative}
.zone .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.zone .body p{margin:0;color:var(--muted);font-size:.92rem}
.zone .row{display:flex;justify-content:space-between;align-items:center;margin-top:auto}
.zone.locked{opacity:.55}
/* team / collection */
.slots{grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:22px}
.slot{border:1px dashed var(--line);border-radius:var(--r-md);padding:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--deep)}
.slot.filled{border-style:solid;background:var(--panel)}
.roster{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.moncard{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);text-align:left}
.moncard{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);text-align:left;box-shadow:inset 0 0 0 1px rgba(127,196,255,.05)}
.moncard .portrait{width:52px;height:52px;font-size:28px}
.moncard .meta{font-size:.82rem;color:var(--muted)}
.moncard.in{box-shadow:inset 0 0 0 2px var(--gold)}
.dex{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}
.dexcell{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.85rem}
.dexcell .portrait{width:58px;height:58px;font-size:32px}
.detail{margin-top:18px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:16px;display:flex;gap:16px;flex-wrap:wrap}
.detail .portrait{width:110px;height:110px;font-size:62px}
.stats{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:.9rem}
.stats span:nth-child(odd){color:var(--muted)}
/* battle */
.battle{display:flex;flex-direction:column;gap:14px;max-width:880px;margin:0 auto}
.order{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:4px 2px}
.order .lbl{color:var(--muted);font-size:.8rem;margin-right:4px;white-space:nowrap}
.order .tk{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:18px;flex:none;border:2px solid var(--line);background:var(--panel)}
.order .tk.E{border-color:var(--bad)}.order .tk.P{border-color:var(--good)}
.order .tk:first-of-type{width:42px;height:42px;font-size:22px;border-color:var(--gold)}
.side-row{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}
.unit{position:relative;width:180px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .2s,opacity .3s}
.unit.enemy{cursor:pointer}
.unit.target{box-shadow:0 0 0 2px var(--bad)}
.unit.active{box-shadow:0 0 0 2px var(--gold);transform:translateY(-4px)}
.unit.active{box-shadow:0 0 0 2px var(--gold)}
.unit.down{opacity:.3}
.unit.sealed{opacity:.25;filter:grayscale(1)}
.unit .nm{font-weight:700}
.unit .lv{color:var(--muted);font-size:.8rem}
.hp{width:100%;height:9px;border-radius:5px;background:#0b1428;overflow:hidden}
.hp>i{display:block;height:100%;background:var(--good);transition:width .35s}
.hp.low>i{background:var(--bad)}
.hpnum{font-size:.78rem;color:var(--muted)}
.tags{position:absolute;top:8px;right:8px;display:flex;gap:3px;font-size:14px}
.float{position:absolute;left:50%;top:30%;transform:translateX(-50%);font:800 1.6rem var(--display);pointer-events:none;animation:up 1s ease-out forwards;text-shadow:0 2px 0 #000}
.float.heal{color:var(--good)}.float.crit{color:var(--gold);font-size:2rem}
@keyframes up{to{transform:translate(-50%,-48px);opacity:0}}
.shake{animation:shake .32s}
@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
.hitstop{animation:flash .18s}
@keyframes flash{50%{filter:brightness(2.2)}}
.vs{text-align:center;color:var(--muted);font-family:var(--display)}
.actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;padding:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--deep)}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:10px 12px;border-radius:var(--r-sm);background:var(--raise);border:1px solid var(--line);text-align:left}
.act .k{font-size:.72rem;color:var(--muted)}
.act .n{font-weight:700}
.act .d{font-size:.78rem;color:var(--muted)}
.act.cap{border-color:var(--gold-dim)}
.act:disabled{opacity:.4;cursor:not-allowed}
.log{font-size:.88rem;color:var(--muted);max-height:120px;overflow:auto;padding:0 4px}
.log div:first-child{color:var(--text)}
/* timing */
.timing{position:fixed;inset:0;background:rgba(5,9,18,.55);display:grid;place-items:center;z-index:20}
.tbox{width:min(460px,90vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:18px;text-align:center}
.track{position:relative;height:26px;border-radius:13px;background:#0b1428;margin:14px 0 8px;overflow:hidden}
.track .good{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--good) 35%,transparent)}
.track .perf{position:absolute;top:0;bottom:0;background:var(--gold)}
.act.util.atkbtn{border-color:#5aa9ff;background:linear-gradient(180deg,#1d3a63,#12233f)}
.tbox.critbox{border-color:#ffb86b;box-shadow:0 0 30px rgba(255,184,107,.35)}.tbox.critbox b{color:#ffcf96}.tbox.critbox .perf{background:#ffcf96}
.track .mk{position:absolute;top:-2px;bottom:-2px;width:4px;background:#fff;border-radius:2px}
/* rewards */
.overlay{position:fixed;inset:0;background:rgba(5,9,18,.78);display:grid;place-items:center;z-index:30;padding:20px}
.rbox{width:min(640px,94vw);background:var(--panel);border:1px solid var(--line);border-radius:var(--r-md);padding:22px;text-align:center}
.rbox h2{font-size:2rem;margin-bottom:4px}
.rbox .sub{color:var(--muted);margin-bottom:14px}
.loot{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:12px 0 18px}
.lcard{width:132px;height:170px;perspective:600px}
.lcard .in{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}
.lcard.flip .in{transform:rotateY(180deg)}
.lcard .f,.lcard .b{position:absolute;inset:0;border-radius:var(--r-md);backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line)}
.lcard .f{background:radial-gradient(circle,#243a66,#101b31);font-size:44px}
.lcard .b{transform:rotateY(180deg);background:var(--deep);padding:8px;font-size:.88rem}
.lcard .b .portrait{width:64px;height:64px;font-size:36px}
.lcard.legendary .b,.lcard.epic .b{box-shadow:0 0 22px color-mix(in srgb,var(--gold) 55%,transparent)}
.new{color:var(--gold);font-weight:800;font-size:.75rem}
/* onboarding */
.onb{max-width:700px;margin:40px auto;text-align:center}
.onb h1{font-size:2.6rem;color:var(--gold)}
.onb p{color:var(--muted)}
.onb input{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--text);padding:10px 12px;font:inherit;width:min(320px,100%);text-align:center;margin:8px 0 20px}
.starters{grid-template-columns:repeat(3,minmax(0,1fr));margin:14px 0 22px}
.starter{border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:16px 10px;display:flex;flex-direction:column;align-items:center;gap:6px}
.starter[aria-pressed="true"]{box-shadow:0 0 0 2px var(--gold)}
.table{width:100%;border-collapse:collapse;font-size:.95rem}
.table th,.table td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left}
.table th{color:var(--muted);font-weight:500}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;border-radius:0;padding:7px 12px;color:var(--muted);font-family:var(--display);letter-spacing:.04em}
.tabs button:hover{color:var(--white)}
.tabs button[aria-selected="true"]{color:var(--white);border-bottom-color:var(--gold);text-shadow:0 0 12px rgba(127,196,255,.6)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--raise);border:1px solid var(--gold-dim);padding:10px 16px;border-radius:var(--r-sm);z-index:40}
.mobnav{display:none}
@media (max-width:1100px){.app{grid-template-columns:210px minmax(0,1fr)}.social{display:none}.social.show{display:flex}}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto}
  .side{display:none}
  main{padding:14px 12px 20px}
  .social.show{display:flex;border:0}
  .app.soc main{display:none}
  .mobnav{display:flex;justify-content:space-around;background:var(--deep);border-top:1px solid var(--line);padding:6px 0}
  .mobnav button{background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;font-size:.72rem;gap:1px;padding:4px 6px}
  .mobnav button[aria-current="page"]{color:var(--gold)}
  .mobnav .ico{font-size:1.2rem}
  .unit{width:calc(50% - 10px);min-width:140px}
  .slots{grid-template-columns:1fr}
  .starters{grid-template-columns:1fr}
}

/* ---- phone layout refinements ---- */
@media (max-width:760px){
  html,body{overscroll-behavior-y:none}
  .app{min-height:100dvh}
  .mobnav{position:sticky;bottom:0;z-index:40;padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px rgba(0,0,0,.45)}
  .mobnav button{min-width:52px;min-height:48px;justify-content:center}
  body.is-onb .mobnav{display:none}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));max-width:88vw;text-align:center}
  body.is-onb .toast{bottom:calc(20px + env(safe-area-inset-bottom,0px))}
  .view-h{flex-direction:column;align-items:flex-start;gap:2px;margin-bottom:10px}
  .view-h h2{font-size:1.45rem}.view-h p{font-size:.9rem;margin:0}
  .tabs{flex-wrap:nowrap!important;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin-left:-2px;margin-right:-2px;padding-bottom:2px}
  .tabs::-webkit-scrollbar{display:none}.tabs button{flex:none;white-space:nowrap}
  .overlay .rbox,.ask .in,.mgov .mgbox,.revealov .rin{max-height:88dvh;overflow:auto}
  .ask .in{width:min(94vw,520px)}
  .ask .row{flex-wrap:wrap;gap:8px}.ask .row .btn{flex:1 1 30%;min-height:46px}
  .revealov .portrait.reveal{width:130px;height:130px;font-size:74px}.revealov h2{font-size:1.7rem}
  .btn{min-height:40px}

.mapview{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
/* The map sits beside its panel as soon as the middle column is wide enough for both.
   This used to key off window width at 1500px, which almost nobody reaches once the nav
   and chat columns are subtracted, so the panel always stacked underneath and the page scrolled. */
main:has(> .mapview){container-type:inline-size;container-name:mainc}
/* The map, the area panel and the chat read top to bottom in one column, across the full
   width, rather than as three vertical bands. The panel goes wide and short to suit. */
@container mainc (min-width:700px){
  .mapview .mapfloat.selfhere{display:none} .mapview .maptabs .maphere{display:none}
  .mappanel{display:grid;grid-template-columns:minmax(210px,272px) minmax(0,1fr);gap:12px 16px;align-items:start}
  .mappanel .actstage{grid-column:1/-1}
  .mappanel .ptabs{grid-column:2;position:static;background:none;padding:0}
  .mappanel .mphead{grid-column:1;grid-row:span 2}
  .mappanel .ppane{grid-column:2}
  .mappanel .ppane>.pstatus{order:-1}
  .ppane{display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:8px 14px;align-content:start}
  .ppane>.pacts{grid-column:span 2}
  .mappanel .grid.runs{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
}

.mappanel{margin-top:12px;border:1px solid var(--line);border-radius:var(--r-md);background:var(--panel);padding:14px}
.mphead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
/* One screen, no page scroll: the map fills the height it is given and the area panel
   scrolls inside its own box rather than pushing the rest of the view off the bottom. */
@media (min-width:761px){
  main:has(> .mapview){padding:12px 18px 14px;overflow:hidden;display:flex;flex-direction:column;gap:10px;position:relative}
  main:has(> .mapview) .mapview{flex:1;min-height:0;align-items:stretch;gap:10px;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,3fr) minmax(0,2fr)}
  main:has(> .mapview) .mapcol{min-height:0;display:flex;flex-direction:column;gap:0}
  main:has(> .mapview) .mapwrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:visible;border:0;background:none}
  /* fitMapView() matches the view box to this box, so the map fills it with no dead borders */
  main:has(> .mapview) .mapwrap .wmap{flex:1;min-height:0;max-height:none;height:100%;width:100%;border:1px solid var(--line);border-radius:var(--r-md);background:#070d1c}
  /* Order of importance, top to bottom: the map gets the most room, then the area panel,
     then the chat strip. */
  main:has(> .mapview) .mappanel{margin-top:0;min-height:0;overflow:auto}
  /* The nav already says which screen this is, so the heading only costs the map height. */
  main:has(> .mapview)>.view-h{display:none}
  /* Chat is docked under the map, so the side column would just repeat it. */
  body:has(main > .mapview) .social{display:none}
  body:has(main > .mapview) .app{grid-template-columns:230px minmax(0,1fr)}
  body.navmini:has(main > .mapview) .app{grid-template-columns:72px minmax(0,1fr)}
}

/* ---- guard windows, sparks, streak, echo memory ---- */
.gwin{position:fixed;z-index:59;width:0;height:0;pointer-events:auto;cursor:pointer;--gc:#7fc4ff;--gc2:#bfe3ff}
.gwin.counter{--gc:#ffcf4d;--gc2:#fff1b8}
.gwin .gzone{position:absolute;left:0;top:0;width:72px;height:72px;transform:translate(-50%,-50%);border-radius:50%;border:2px dashed color-mix(in srgb,var(--gc) 55%,transparent);opacity:.8}
.gwin .gcore{position:absolute;left:0;top:0;width:60px;height:60px;transform:translate(-50%,-50%);border-radius:50%;display:grid;place-items:center;color:var(--gc2);background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--gc) 35%,#0a1222),#0a1222 75%);border:2px solid var(--gc);box-shadow:0 0 20px color-mix(in srgb,var(--gc) 65%,transparent),inset 0 0 14px color-mix(in srgb,var(--gc) 35%,transparent)}
.gwin .gico{width:32px;height:32px;display:block;filter:drop-shadow(0 0 6px var(--gc))}.gwin .gico svg{width:100%;height:100%;display:block}
.gwin .gring{position:absolute;left:0;top:0;width:72px;height:72px;transform:translate(-50%,-50%) scale(2.4);border-radius:50%;border:3px solid #fff;box-shadow:0 0 16px var(--gc),inset 0 0 10px color-mix(in srgb,var(--gc) 50%,transparent);opacity:.95}
.gwin .gring i{position:absolute;left:50%;top:-7px;width:3px;height:9px;margin-left:-1.5px;background:var(--gc2);border-radius:2px;transform-origin:50% 43px}
.gwin .gring i:nth-child(2){transform:rotate(90deg)}.gwin .gring i:nth-child(3){transform:rotate(180deg)}.gwin .gring i:nth-child(4){transform:rotate(270deg)}
.gwin .gtell{position:absolute;left:0;top:-58px;transform:translateX(-50%);font:800 .95rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--gc2);text-shadow:0 0 12px var(--gc),0 1px 3px #000;white-space:nowrap;animation:gtell .5s ease-out}
@keyframes gtell{from{transform:translate(-50%,8px);opacity:0}}
.gwin .glbl{position:absolute;left:0;top:46px;transform:translateX(-50%);white-space:nowrap;font-size:.78rem;color:var(--ice);text-shadow:0 1px 3px #000;display:flex;gap:5px;align-items:center;background:rgba(8,14,28,.7);padding:2px 8px;border-radius:999px;border:1px solid rgba(127,196,255,.25)}
.gwin.counter .gcore{animation:gcorepulse .55s ease-in-out infinite alternate}
@keyframes gcorepulse{from{box-shadow:0 0 14px color-mix(in srgb,var(--gc) 55%,transparent)}to{box-shadow:0 0 34px var(--gc)}}
.gwin.perfect .gcore{border-color:#fff;box-shadow:0 0 34px var(--gc);animation:gpop .45s ease-out}
.gwin.good .gcore{border-color:var(--good);box-shadow:0 0 22px var(--good);animation:gpop .4s ease-out}
.gwin.landed .gcore{border-color:#fff;background:#ffcf4d;color:#2a1c00;box-shadow:0 0 44px #ffcf4d,0 0 90px rgba(255,207,77,.6);animation:gpop .5s ease-out}
.gwin.miss{opacity:0;transition:opacity .15s}
.gwin.perfect .gring,.gwin.good .gring,.gwin.landed .gring{opacity:0}
.gwin.perfect .gzone,.gwin.good .gzone,.gwin.landed .gzone{opacity:0}
@keyframes gpop{0%{transform:translate(-50%,-50%) scale(1)}40%{transform:translate(-50%,-50%) scale(1.4)}100%{transform:translate(-50%,-50%) scale(1)}}
.perfpulse{position:fixed;inset:0;z-index:55;pointer-events:none;box-shadow:inset 0 0 0 4px #ffe066,inset 0 0 80px rgba(255,224,102,.35);animation:perfpulse .38s ease-out forwards}
@keyframes perfpulse{from{opacity:1}to{opacity:0}}
.act.tile.spark{border-color:#ffe066;box-shadow:0 0 0 1px rgba(255,224,102,.5),0 0 18px rgba(255,224,102,.35);animation:sparkglow 1.1s ease-in-out infinite alternate}
.act.tile.spark::before{background:#ffe066}
@keyframes sparkglow{from{box-shadow:0 0 0 1px rgba(255,224,102,.4),0 0 10px rgba(255,224,102,.2)}to{box-shadow:0 0 0 1px rgba(255,224,102,.8),0 0 22px rgba(255,224,102,.5)}}
.streak{display:none;margin-left:10px;font:700 .8rem var(--body);color:#ffe066;letter-spacing:.02em;vertical-align:middle;text-shadow:0 0 10px rgba(255,224,102,.6)}
.streak.on{display:inline-block}
.echoring{position:relative;display:grid;place-items:center;width:240px;height:240px;margin:6px auto;border-radius:50%;border:1px solid var(--line);background:radial-gradient(circle,color-mix(in srgb,var(--ec) 18%,transparent),transparent 70%)}
.echoring .portrait{width:84px;height:84px;font-size:48px}
.echoglyphs{position:absolute;inset:0}
.echoglyphs .eg{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid color-mix(in srgb,var(--ec) 60%,var(--line));background:#0a1222;color:var(--ec);font-size:1.3rem;display:grid;place-items:center;transition:transform .12s,box-shadow .12s,background .12s;touch-action:none}
.echoglyphs .eg-up{left:50%;top:0;transform:translate(-50%,-30%)}.echoglyphs .eg-down{left:50%;bottom:0;transform:translate(-50%,30%)}
.echoglyphs .eg-left{top:50%;left:0;transform:translate(-30%,-50%)}.echoglyphs .eg-right{top:50%;right:0;transform:translate(30%,-50%)}
.echoglyphs .eg.lit,.echoglyphs .eg.down{background:var(--ec);color:#04101f;box-shadow:0 0 22px var(--ec)}
.echoslots{display:flex;gap:6px;justify-content:center;margin:8px 0 4px}.echoslots i{width:22px;height:8px;border-radius:4px;background:#26324a}.echoslots i.ok{background:var(--good)}.echoslots i.bad{background:var(--bad)}
.echoring.perf{box-shadow:0 0 40px #ffe066}.echoring.good{box-shadow:0 0 30px var(--good)}
@media (max-width:760px){.echoring{width:200px;height:200px}.echoglyphs .eg{width:48px;height:48px}}
/* ---- section scroll snap: wheel/scroll lands on the next section heading instead of anywhere ---- */
main:not(:has(> .battle)){scroll-snap-type:y proximity;scroll-padding-top:14px;scroll-behavior:smooth}
main:not(:has(> .battle)) .view-h,main:not(:has(> .battle)) .admin-sec,main:not(:has(> .battle)) .zsec,main:not(:has(> .battle)) h3:not(.moncard h3,.dexcell h3,.mphead h3,.detail h3,.zone h3){scroll-snap-align:start;scroll-margin-top:14px}

main:not(:has(> .battle))::after{content:"";display:block;height:1px;scroll-snap-align:end}
@media (prefers-reduced-motion:reduce){main{scroll-behavior:auto}}
/* ---- fullscreen battle (desktop): battle fills the main pane instead of a 920px column ---- */
@media (min-width:761px){
  main:has(> .battle){padding:12px 18px;overflow:auto;display:flex;flex-direction:column}
  main:has(> .battle) .battle{max-width:none;width:100%;margin:0;flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(150px,1fr);grid-auto-rows:auto;gap:10px}
  .battle .camwrap{min-height:0;display:flex;flex-direction:column}
  .battle .cam{flex:1;min-height:0;display:flex;flex-direction:column}
  .battle .cam .scene{flex:1;min-height:0;display:flex;flex-direction:column}
  .battle .cam .scene>.inner{flex:1;min-height:0;display:flex;flex-direction:column}
  .battle .cam .stage{flex:1;justify-content:space-between;padding:clamp(10px,2vh,28px) 16px clamp(24px,5vh,60px)}
  .battle .stage .side-row{gap:clamp(14px,2.5vw,40px)}
  /* Cards stay small on purpose: the big art plays as a cut-in when a unit acts,
     so the stage itself can show the painted background rather than four tall portraits. */

  .battle .stage .unit.enemy{width:clamp(100px,8vw,128px)}

  .battle .skillbar{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .battle .log{max-height:none}
  .battle .bfoot{grid-template-columns:minmax(0,1fr) minmax(230px,300px);height:clamp(96px,13vh,150px)}
  .battle .bfoot .bchat{border-left:1px solid var(--line);padding-left:10px}
  /* The fight takes the whole width: area chat lives in the strip under it now,

  body:has(main > .battle) .social{display:none}
  body:has(main > .battle) .app{grid-template-columns:230px minmax(0,1fr)}

/* Battle stage fits its box: the scene measures its own height and the units shrink to match,
   so short windows (or a zoomed-in browser) never push the enemy row out of view. */
.battle .cam .scene>.inner{container-type:size;container-name:bstage}
.battle .cam .stage{min-height:0}
@container bstage (max-height:470px){
  .battle .cam .stage{padding:6px 12px 8px;gap:2px}
  .battle .stage .side-row{gap:clamp(10px,2vw,28px)}
  .battle .stage .unit.enemy{padding:4px 6px 6px;width:clamp(96px,7.5vw,118px)}
  .battle .stage .unit.enemy .portrait,.battle .stage .unit.enemy .portrait:has(img.sprite){width:50px;height:50px;font-size:28px}
  .battle .stage .unit .portrait{width:50px;height:50px;font-size:28px}
  .battle .stage .unit .plate{padding:2px 6px}
  .battle .stage .unit .plate b{font-size:.84rem;line-height:1.15}
  .battle .stage .unit:not(.enemy) .gshadow{width:70px;height:14px;margin-top:-10px}
}
@container bstage (max-height:360px){
  .battle .stage .unit.enemy{display:grid;grid-template-columns:40px minmax(0,1fr);align-items:center;column-gap:6px;width:clamp(150px,13vw,190px);text-align:left}
  .battle .stage .unit.enemy .tags{grid-column:1/-1}
  .battle .stage .unit.enemy .portrait,.battle .stage .unit.enemy .portrait:has(img.sprite){width:40px;height:40px;font-size:22px}
  .battle .stage .unit.enemy .plate{padding:0}
  .battle .stage .unit .portrait{width:40px;height:40px;font-size:22px}
  .battle .stage .unit .plate b{font-size:.78rem}
  .battle .stage .unit .lv{font-size:.7rem}
}
@container bstage (max-height:260px){
  .battle .stage .unit:not(.enemy){display:grid;grid-template-columns:36px minmax(0,1fr);align-items:center;column-gap:6px;width:clamp(140px,12vw,180px);text-align:left}
  .battle .stage .unit:not(.enemy) .tags{grid-column:1/-1}
  .battle .stage .unit:not(.enemy) .gshadow{display:none}
  .battle .stage .unit .portrait,.battle .stage .unit.enemy .portrait,.battle .stage .unit.enemy .portrait:has(img.sprite){width:36px;height:36px;font-size:20px}
  .battle .stage .unit .plate{padding:1px 4px}
}
/* the battle log fills the footer strip instead of sitting short beside the chat */
.battle .bfoot{align-items:stretch}
.battle .bfoot .log{height:auto;min-height:0;align-self:stretch}

function areaStage(id){

   ${ex?`<span class="acttxt">${esc(EXPLORING.txt)}</span><span class="xbar actbar"><i style="animation-duration:${dur}s;animation-delay:-${off}s"></i></span>`:""}</div>`;

const SKILLS=[...ENERGIES,"Soulcraft","Barter","Shadow","Lantern","Mentor"];
const GOVERNS={Chronal:"Swiftness",Quantum:"Swiftness",Soulcraft:"Swiftness",Aetherial:"Mind",Psionic:"Mind",NEXUS:"Mind",Spirit:"Might",Alchemy:"Might",Celestial:"Resolve","Soul Essence":"Vitality",Barter:null,Shadow:"Swiftness",Lantern:"Mind",Mentor:"Mind"};
const ATTRS=["Might","Resolve","Swiftness","Vitality","Mind"];
// Mind decides how many different energy types a Keeper can hold safely. Going over causes Strain.
function safeTypes(){ const m=(S.attrs||{}).Mind||0; return 2+(m>=8?1:0)+(m>=18?1:0); }
function heldEnergies(lo){ const out=[]; (lo||[...(S.loadout||[]),...(wSkill()?[wSkill()]:[])]).forEach(k=>{ const e=moveEnergy(k); if(e&&!out.includes(e)) out.push(e); }); return out; }
function strainedEnergies(lo){ const h=heldEnergies(lo), n=safeTypes(); return h.slice(n); }
function overBy(lo){ return Math.max(0,heldEnergies(lo).length-safeTypes()); }
const MAJOR={hourblade:["Chronal","Spirit"],evoker:["Aetherial","Celestial"],dawnward:["Celestial","Soul Essence"],guardian:["Spirit","Alchemy"],slipstream:["Chronal","Quantum"]};
const SKILL_TEACH={Chronal:{20:"hourbreak",35:"qshift"},Aetherial:{20:"conjure",35:"needle"},Celestial:{20:"rekindle",35:"barrier"},Spirit:{20:"ironoath",35:"radiant"},"Soul Essence":{20:"dawnlight"},Quantum:{20:"qshift"},Psionic:{20:"needle"},Alchemy:{20:"ironoath"},NEXUS:{30:"nullhymn"}};
function initSkills(arch){ S.skills={}; S.st=S.st||{}; S.st.typesV2=true; SKILLS.forEach(k=>S.skills[k]={lv:k==="Lantern"?0:5,xp:0}); (MAJOR[arch]||[]).forEach(k=>S.skills[k].lv=15); S.attrs={Might:0,Resolve:0,Swiftness:0,Vitality:0,Mind:0}; S.attrUps={}; }
function skillNeed(lv){ return 3+Math.floor(lv/4); }
function trainSkill(k,n,out){ const sk=S.skills&&S.skills[k]; if(!sk||sk.lv>=100||(k==="Lantern"&&sk.lv<=0)) return;
  sk.xp+=n; while(sk.lv<100&&sk.xp>=skillNeed(sk.lv)){ sk.xp-=skillNeed(sk.lv); sk.lv++; const g=GOVERNS[k]; if(g) S.attrUps[g]=(S.attrUps[g]||0)+1;
    (out||[]).push(`${k} skill rose to ${sk.lv}`); const t=(SKILL_TEACH[k]||{})[sk.lv]; if(t&&!S.learned.includes(t)){ S.learned.push(t); (out||[]).push(`Your ${k} training taught you ${MOVES[t].n}`); }
  } }
function applyAttrs(st,A){ if(!A) return st; st.hp+=A.Vitality*2; st.atk+=Math.round(A.Might*.5); st.def+=Math.round(A.Resolve*.5); st.spd+=Math.round(A.Swiftness*.3); return st; }
function attrLevelUp(out){ const bits=[]; ATTRS.forEach(a=>{ const g=Math.min(5,1+Math.floor((S.attrUps[a]||0)/2)); S.attrs[a]+=g; bits.push(`${a} +${g}`); }); S.attrUps={}; if(out) out.push("Attributes: "+bits.join(", ")); }
function trainFromBattle(b,out){ Object.entries(b.kuse||{}).forEach(([mk,n])=>{ const e=moveEnergy(mk); if(e) trainSkill(e,n,out); }); }
function skillsHTML(){
  const usedTypes=new Set((S.learned||[]).map(k=>moveEnergy(k)).filter(Boolean));
  const rows=SKILLS.filter(k=>S.skills[k]&&!(k==="Lantern"&&S.skills[k].lv<=0)&&(!ENERGIES.includes(k)||usedTypes.has(k)||(MAJOR[S.arch]||[]).includes(k)||S.skills[k].lv>5)).map(k=>{ const sk=S.skills[k], maj=(MAJOR[S.arch]||[]).includes(k);

  const at=ATTRS.map(a=>`<span>${a}</span><span>${S.attrs[a]}${S.attrUps[a]?` <small style="color:var(--good)">(+${S.attrUps[a]} pending)</small>`:""}</span>`).join("");

/* ============ STAMINA ============ */
// Framed as a bonus that fades, not a punishment: Well Rested -> Steady -> Weary -> Exhausted.
// Only travel between areas (and hiding) costs stamina. Exploring inside an area is free. Full recovery ~30 min, offline included.
const STAM_COST={town:0,meadow:3,emberwood:5,shallows:6,riftscar:10}, STAM_REGEN=100/30; // per minute
function stamina(){ if(!S) return 100; const now=Date.now(); if(S.stam==null){ S.stam=100; S.stamAt=now; }
  const mins=(now-(S.stamAt||now))/60000; if(mins>0){ S.stam=Math.min(100,S.stam+mins*STAM_REGEN); S.stamAt=now; } return S.stam; }
function spendStam(n){ stamina(); S.stam=Math.max(0,S.stam-n); S.stamAt=Date.now(); }
function restState(){ const v=stamina(); return v>=60?{k:"rested",n:"Well Rested",atk:1.08,cat:1.05,c:"var(--good)"}:v>=20?{k:"steady",n:"Steady",atk:1,cat:1,c:"var(--muted)"}:v>0?{k:"weary",n:"Weary",atk:.92,cat:.85,c:"#e9a86a"}:{k:"exhausted",n:"Exhausted",atk:.85,cat:.7,c:"var(--bad)"}; }
function stamHTML(){ const v=Math.round(stamina()), r=restState(); return `<span class="stam" title="${r.n}: ${v}/100"><i style="width:${v}%;background:${r.c}"></i></span> <small style="color:${r.c}">${r.n}</small>`; }

function myLantern(){ return (S&&S.skills&&S.skills.Lantern&&S.skills.Lantern.lv)||0; }
function myShadow(){ return (S&&S.skills&&S.skills.Stealth&&S.skills.Stealth.lv)||0; }

function setHidden(on,why){ if(!S) return; if(on===!!S.hidden) return; S.hidden=on; setTimeout(fxSmoke,30); if(on){ toast("You fold into the dark. Nobody can sense you… probably."); sfx("suck",.3); } else if(why) toast(why); saveSoon(); setDoing(); if(!B) render(); }

  if(S.hidden){ spendStam(1); const near=peers.filter(p=>!p.isMe&&p.presence&&p.presence.loc===S.loc).length; trainSkill("Stealth",1+(near?1:0));

// Every place has an address. An address shows WHERE something is, never how to get in.
const NODE_XYZ={town:[0,0,0],meadow:[0,120,0],emberwood:[-180,220,0],shallows:[190,220,-1],riftscar:[0,420,0]};
function addrOf(x,y,z){ return `Z${z} · ${x} · ${y}`; }
function nodeAddr(id){ const c=NODE_XYZ[id]; return c?addrOf(c[0],c[1],c[2]):""; }
function gateAddr(k,v){ const g=GATES[k]||DBGATES[k]; const base=g?g.base:(v&&v.w?genGateRun(v.w).z:"meadow"); const c=NODE_XYZ[base]||[0,0,0]; const h=parseInt(String(k).slice(-6),36)||1;
  return addrOf(c[0]+(h%61)-30,c[1]+(Math.floor(h/61)%61)-30,g?(h%2?-1:-2):((h%3)-1)); }
const ADDR_RE=/Z(-?\d{1,2}) · (-?\d{1,4}) · (-?\d{1,4})/;
function goAddr(txt){ const m=String(txt).match(ADDR_RE); if(!m) return; const [,z,x,y]=m.map(Number), a=addrOf(x,y,z);
  const node=Object.keys(NODE_XYZ).find(id=>nodeAddr(id)===a); if(node){ go("hunt"); mapSel=node===S.loc?null:node; render(); toast(`Waypoint set: ${mapAreaLabel(node)}.`); return; }
  const gk=Object.keys(S.gates||{}).find(k=>gateAddr(k,S.gates[k])===a); if(gk){ const v=S.gates[gk]; gatePick=[...v.w]; gateItem=v.i&&S.bag[v.i]?v.i:""; go("gate"); toast(`That's ${v.t}. The words are filled in.`); return; }
  let best="town",bd=1e9; Object.entries(NODE_XYZ).forEach(([id,c])=>{ const d=Math.hypot(c[0]-x,c[1]-y); if(d<bd){ bd=d; best=id; } });
  go("hunt"); mapSel=best===S.loc?null:best; render(); toast(`Your map shows nothing at ${a}. Something might be hidden near ${mapAreaLabel(best)}.`); }
function copyAddr(a){ try{ navigator.clipboard.writeText(a).then(()=>toast("Address copied."),()=>toast(a)); }catch(e){ toast(a); } }

let FORK=null;
function planForks(zid,secs){ const pool=(FORKS[zid]||FORKS._).map(p=>p.slice()); const n=secs<5.5?1:2, out=[];
  for(let i=0;i<n&&pool.length;i++){ const opts=pool.splice(Math.floor(Math.random()*pool.length),1)[0]; if(Math.random()<.5) opts.reverse(); out.push({at:n===1?.45:(i?.68:.32),opts,done:false}); }
  return out; }
function tripDur(t){ return (t.end-t.start)*(SET.fast?.6:1); }
function forkNote(zid,o){ S.forkNotes=S.forkNotes||{}; const L=S.forkNotes[zid]=S.forkNotes[zid]||[]; const fresh=!L.includes(o.n); if(fresh){ L.push(o.n); S.codexNew=true; } return fresh; }
function forkPick(i,auto){ if(!FORK) return; const {trip,f,el}=FORK, o=f.opts[i]; if(!o) return;
  f.done=true; trip.lean[o.k]=(trip.lean[o.k]||0)+1; const paused=Date.now()-FORK.opened; trip.start+=paused; trip.end+=paused; FORK=null;
  el.classList.add('picked'); el.querySelectorAll('[data-fk]').forEach(b=>b.classList.toggle('chosen',+b.dataset.fk===i));
  const fresh=forkNote(trip.zid,o); sfx(fresh?'discovery':'tick',fresh?.22:.2);
  el.querySelector('.fk-note').innerHTML=`${fresh?'<b>Codex</b> · ':''}${esc(o.n)}`;
  trip.txt=o.l+'…'; saveSoon(); render();
  setTimeout(()=>el.remove(),auto?2600:3200); }
function openFork(trip,f){
  if(SET.autoFork){ f.done=true; const i=Math.floor(Math.random()*2), o=f.opts[i]; trip.lean[o.k]=(trip.lean[o.k]||0)+1; if(forkNote(trip.zid,o)) toast(`Codex · ${nodeName(trip.zid)}: ${o.n}`); return; }
  document.querySelectorAll('.forkov').forEach(x=>x.remove());
  const pad=document.body.classList.contains('pad'), kl=(k,p)=>`<span class="k">${pad?p:k}</span>`;
  const el=document.createElement('div'); el.className='forkov'; el.setAttribute('role','dialog'); el.setAttribute('aria-label','The path splits');
  el.innerHTML=`<div class="fk-h">The path splits</div><div class="fk-row">
    <button class="fk-b" data-fk="0">${kl('◀ A','◀')}<span>${esc(f.opts[0].l)}</span></button>
    <button class="fk-b" data-fk="1"><span>${esc(f.opts[1].l)}</span>${kl('D ▶','▶')}</button></div>
    <div class="fk-note" aria-live="polite"></div><div class="fk-t"><i></i></div>`;
  document.body.appendChild(el);
  el.querySelectorAll('[data-fk]').forEach(b=>b.onclick=()=>forkPick(+b.dataset.fk));
  FORK={trip,f,el,opened:Date.now()}; sfx('appear',.18);
  const mine=FORK; setTimeout(()=>{ if(FORK===mine){ el.querySelector('.fk-note').textContent='You let your feet decide.'; forkPick(Math.random()<.5?0:1,true); } },5000); }
window.addEventListener('keydown',e=>{ if(!FORK) return; const tg=e.target; if(tg&&(tg.tagName==='INPUT'||tg.tagName==='TEXTAREA'||tg.isContentEditable)) return;

function vigWho(by,c){ const tm=teamMons();
  if(!by||by==="keeper") return {ok:true,who:"keeper"};
  if(by==="lead"||by==="el") return c.lead?{ok:true,who:c.lead}:{ok:false};
  if(by.startsWith("el:")){ const m=tm.find(x=>typeId(SPECIES[x.sp].el)===by.slice(3)); return m?{ok:true,who:m}:{ok:false}; }
  if(by.startsWith("sp:")){ const m=tm.find(x=>x.sp===by.slice(3)||x.sp.startsWith(by.slice(3))); return m?{ok:true,who:m}:{ok:false}; }
  return {ok:false}; }

function gqFill(s,x){ return String(s||"").replace(/\{(\w+)\}/g,(m,k)=>x[k]!=null&&typeof x[k]!=="object"?x[k]:m); }
function gqPanels(list,x){ return list.map(p=>({...p,cap:p.cap&&gqFill(p.cap,x),say:p.say&&gqFill(p.say,x)})); }

function gqCallback(q){ q.cbAt=Date.now()+(SET.fast?60e3:ri(20,45)*60e3); q.stage=4; saveSoon(); }
async function gqCallbackScene(q){ const T=GQ_PROBLEMS[q.prob].twists[q.twist], c=T.ch[q.choice]||{}; const x=gqCtx(q);
  q.stage=9; q.doneAt=Date.now(); S.gqDone=(S.gqDone||0)+1;
  const v={id:"gq-cb",p:()=>[{a:"keeper",cap:"Some time later."},{a:"place",cap:gqFill(c.cb?c.cb(x):"You hear nothing more of it.",x)}],ch:()=>[{by:"keeper",l:"Carry on",loot:c.cbPay||0,res:""}]};
  await playVignette(v,{...x,zid:S.loc},{title:gqTitle(q),sub:"What came of it"}); saveSoon(); }
/* after a fight that belonged to an errand */
function gqFightDone(f,win){ const q=(S.gq||[]).find(z=>z.id===f.id); if(!q) return;
  if(!win){ toast(`${gqTitle(q)}: that didn't go well. Try again when you're ready.`); return; }
  if(f.to===4&&f.pay!=null){ const n=gqPay(q,f.pay); toast(`${gqTitle(q)}: done.${n?` +${n} coins`:""}`); gqCallback(q); return; }
  q.stage=f.to; if(q.stage===4) gqCallback(q); toast(`${gqTitle(q)}: ${gqHint(q)}`); saveSoon(); }
/* Explore hook: callbacks first, then any errand step in this region, then sometimes a new request. */
async function gqExplore(zid){
  const due=(S.gq||[]).find(q=>q.stage===4&&q.cbAt&&Date.now()>=q.cbAt); if(due){ await gqCallbackScene(due); return true; }
  const step=gqActive().find(q=>(q.stage===1||q.stage===2)&&q.b===zid||q.stage===3&&q.home===zid); if(step){ await gqStep(step,zid); saveSoon(); return true; }

/* ============ SECRET CAVES ============ */
// A few hollows can be found by speaking freely at the Rift Gate. The first Keeper inside can claim one and set
// their OWN secret words. Everything inside (description, notice board, stash, chat) is encrypted with those words,
// so without them it's unreadable, even to someone reading the database directly.
const CAVE_INIT={}; // filled at load from hashed phrases
[["o0uagt6ng","The Quiet Hollow","fen","A dry cave behind the reeds. Somebody left a candle stub and a chair. Just one chair."],
 ["1kygkaqd30s","The Locked Room","deep","A vault at the bottom of a stair. The lock is on the inside."],
 ["a2aq53x9wr","The Whale's Rest","star","A hollow inside a drifting island. You can hear singing through the rock."]].forEach(([k,n,loc,d])=>CAVE_INIT[k]={n,loc,d});
const normPhrase=ph=>String(ph).toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim();
const caveKey=ph=>cyrb53("cave|"+normPhrase(ph));
let CAVE=null, caveMsgs=[], caveUnsub=null;
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

  return crypto.subtle.deriveKey({name:"PBKDF2",salt:unb64(salt),iterations:120000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]); }
async function seal(key,obj){ const iv=crypto.getRandomValues(new Uint8Array(12)); const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,new TextEncoder().encode(JSON.stringify(obj))); return {iv:b64(iv),ct:b64(ct)}; }

async function speakFreely(phrase){
  phrase=String(phrase||"").trim(); if(phrase.split(/\s+/).length<2){ toast("Say at least two words."); return; } if(RUN){ toast("Finish your run first."); return; }
  const k=caveKey(phrase); spendStam(4); sfx("suck");
  if(!db){ toast("The words echo, but nothing answers. (Caves need the shared world.)"); return; }
  let snap=null; try{ snap=await db.doc("caves/"+k).get(); }catch(e){}
  if(snap&&snap.exists){ const c=snap.data(); if(c.sealed){ toast("The hollow is sealed. Someone has claimed it and changed its words."); return; }
    try{ const key=await caveCryptoKey(phrase,c.salt), inner=await unseal(key,c.box); enterCave(k,key,c,inner,phrase); }catch(e){ toast("The words fit the lock, but the lock doesn't turn."); } return; }
  if(CAVE_INIT[k]){ const ci=CAVE_INIT[k]; CAVE={k,claimed:false,init:ci,phrase}; S.st.cavesFound=(S.st.cavesFound||0)+1; view="cave"; render(); setDoing(); if(!S.secrets.hollow) earnSecret("hollow"); return; }
  toast("The words drift off into the Hall. Nothing answers them.");
}
async function claimCave(){
  if(!CAVE||CAVE.claimed||!db) return;
  const box=document.createElement("div"); box.className="ask"; box.innerHTML=`<div class="in"><p style="margin:0 0 8px"><b>Choose new secret words</b> for ${esc(CAVE.init.n)}. Anyone who knows them can come in; nobody else can even read what's inside. Tell them only to people you trust. At least three words.</p><input id="cvPh" maxlength="80" style="width:100%;box-sizing:border-box" placeholder="three or more secret words"><div class="row"><button class="btn" data-no>Cancel</button><button class="btn gold" data-yes>Claim</button></div></div>`;
  document.body.appendChild(box); const inp=box.querySelector("#cvPh"); inp.focus();
  const ph=await new Promise(r=>{ box.querySelector("[data-no]").onclick=()=>r(null); box.querySelector("[data-yes]").onclick=()=>r(inp.value.trim()); }); box.remove();
  if(!ph) return; if(ph.split(/\s+/).length<3){ toast("Use at least three words."); return; }

/* ============ PORTAL POST ============ */
// Every broken portal has a mailbox. Letters travel the roads: the further apart sender and recipient are,
// the longer they take (1 minute per road, more between worlds). A letter can carry coins or one item.
let MAIL=[], mailTab="in";
const STAMP=5;
function roadsBetween(a,b){ if(!a||!b) return 6; if(a===b) return 0; const p=mapPath(a,b); const hops=p.length<=1?8:p.length-1; return hops+(worldOf(a)!==worldOf(b)?3:0); }
function deliveryMins(a,b){ return Math.max(1,Math.min(30,roadsBetween(a,b))); }
function mailFor(){ return MAIL.filter(m=>m.to===me.id&&!(S.claimed||{})["mail:"+m.id]); }
function arrived(m){ return Date.now()>=m.arriveAt; }
function knownPlayers(){ return Object.entries(players).filter(([id,p])=>id!==me.id&&p.handle).map(([id,p])=>({id,...p})).sort((a,b)=>String(a.handle).localeCompare(b.handle)); }
async function sendLetter(to,text,att,coins){
  if(!db){ toast("The post needs the shared world."); return false; } text=String(text||"").trim().slice(0,400); coins=Math.max(0,Math.round(+coins||0));
  const p=players[to]; if(!p){ toast("Choose who it's for."); return false; } if(!text&&!att&&!coins){ toast("Write something, or attach something."); return false; }
  const cost=STAMP+coins; if(S.coins<cost){ toast(`You need ${cost} coins (${STAMP} for the stamp${coins?" plus what you're sending":""}).`); return false; }
  if(att&&!(S.bag[att]>0)){ toast("You don't have that anymore."); return false; }
  const mins=deliveryMins(S.loc,p.loc); spend(cost,"spend"); if(att){ S.bag[att]--; if(S.bag[att]<=0) delete S.bag[att]; }
  try{ await db.collection("mail").add({to,from:me.id,fh:S.handle,th:p.handle,text,item:att||null,coins,fromLoc:S.loc,sentAt:Date.now(),arriveAt:Date.now()+mins*60000}); }
  catch(e){ earn(cost,"gift"); if(att) giveItem(att); toast("The mailbox jammed. Nothing was sent."); return false; }
  saveSoon(); toast(`Sent to ${p.handle}. It should arrive in about ${mins} minute${mins===1?"":"s"}.`); sfx("whoosh",.3); return true; }
function openLetter(id){ const m=MAIL.find(x=>x.id===id); if(!m||!arrived(m)) return; S.claimed=S.claimed||{}; if(S.claimed["mail:"+id]) return;
  S.claimed["mail:"+id]=true; const bits=[]; if(m.coins){ earn(m.coins,"gift"); bits.push(`${m.coins} coins`); } if(m.item&&ITEMS[m.item]){ giveItem(m.item); bits.push(ITEMS[m.item].n); }
  S.st.lettersRead=(S.st.lettersRead||0)+1; checkSecrets("mail"); saveSoon();
  const o=document.createElement("div"); o.className="overlay"; o.innerHTML=`<div class="rbox readbox"><div style="font-size:40px">✉️</div><h2>From ${esc(m.fh)}</h2><p class="meta">Sent from ${esc(nodeName(m.fromLoc))}, ${new Date(m.sentAt).toLocaleString()}</p><p class="readtext"></p>${bits.length?`<p style="color:var(--gold)">Enclosed: ${esc(bits.join(" and "))}</p>`:""}<div class="arow" style="justify-content:center"><button class="btn gold" id="lReply">Reply</button><button class="btn" id="lClose">Close</button></div></div>`;
  o.querySelector(".readtext").textContent=m.text||"(No message. Just what was enclosed.)"; document.body.appendChild(o);
  if(db) db.doc("mail/"+id).delete().catch(()=>{});
  o.querySelector("#lClose").onclick=()=>{ o.remove(); renderPortal(); }; o.querySelector("#lReply").onclick=()=>{ o.remove(); mailTab="write"; mailTo=m.from; renderPortal(); }; }
let mailTo="", mailNotified={};
function mailHTML(){
  const inbox=mailFor(), here=inbox.filter(arrived), coming=inbox.filter(m=>!arrived(m)), sent=MAIL.filter(m=>m.from===me.id&&!arrived(m));
  const tabs=`<div class="tabs" role="tablist" style="justify-content:center"><button role="tab" aria-selected="${mailTab==="in"}" data-mt="in">Letters (${here.length})</button><button role="tab" aria-selected="${mailTab==="write"}" data-mt="write">Write</button><button role="tab" aria-selected="${mailTab==="sent"}" data-mt="sent">On the road (${sent.length})</button></div>`;

    ${coming.length?`<p class="meta">${coming.length===1?"A letter is":coming.length+" letters are"} on the road to you. The next arrives in about ${Math.max(1,Math.ceil((Math.min(...coming.map(m=>m.arriveAt))-Date.now())/60000))} min.</p>`:""}`;

    body=`${ps.length?`<div class="arow"><label style="flex:1">To<select id="mlTo"><option value="">Choose a Keeper</option>${ps.map(p=>`<option value="${esc(p.id)}" ${p.id===mailTo?"selected":""}>${esc(p.handle)}${p.loc?" · last seen "+esc(nodeName(p.loc)):""}</option>`).join("")}</select></label></div>
      <p class="meta" id="mlEta">${to?`Delivery to ${esc(to.handle)}: about ${deliveryMins(S.loc,to.loc)} min from here.`:"Letters take longer the further apart you are."}</p>
      <textarea id="mlText" maxlength="400" rows="4" placeholder="Write your letter" style="width:100%;box-sizing:border-box"></textarea>

      <button class="btn gold" id="mlSend">Send (${STAMP} 🪙 stamp)</button></div>`:'<p class="empty">You don\'t know any other Keepers yet.</p>'}`; }
  else body=sent.map(m=>`<div class="srow"><span>✉️ to <b>${esc(m.th||"?")}</b></span><small class="meta">arrives in ~${Math.max(1,Math.ceil((m.arriveAt-Date.now())/60000))} min</small></div>`).join("")||'<p class="empty">Nothing on the road. Letters disappear from here once they arrive.</p>';
  return `<p class="meta" style="text-align:center">Every broken portal has a mailbox. Letters travel the roads between you.</p>${tabs}${body}`; }
function bindMail(o){
  o.querySelectorAll("[data-mt]").forEach(b=>b.onclick=()=>{ mailTab=b.dataset.mt; renderPortal(); });

/* ============ PVP: duels, ambushes, Hollow Marks ============ */
// Safe: Hall's Edge, the Meadow, the Fen. Contested: ambushing marks you. Lawless: anything goes.
const SAFE_Z=["town","meadow","fen"], LAWLESS_Z=["riftscar","night","clock","star","court","deep","tidew"];
function lawOf(loc){ return SAFE_Z.includes(loc)?"safe":LAWLESS_Z.includes(loc)?"lawless":"contested"; }
function marked(p){ return !!p&&p.mark&&p.mark>Date.now(); }
function amMarked(){ return (S.mark||0)>Date.now(); }
let duelAsks=[];
function askDuel(peer,uid2){ if(!room) return; room.emit("duel",{t:"ask",to:peer,uid:me.id,h:S.handle,loc:S.loc}).catch(()=>{}); toast("Challenge sent."); }
function onDuel(msg){ const d=msg.data||{}; if(!S||!S.handle||msg.isMe) return;
  if(d.t==="ask"&&d.to===myPeer()&&d.loc===S.loc){ duelAsks=[{peer:msg.peer,uid:d.uid,h:String(d.h).slice(0,18)}]; toast(`${duelAsks[0].h} challenges you to a duel.`); if(view==="hunt"&&!B) render(); }
  if(d.t==="yes"&&d.to===myPeer()){ startPvp(d.uid,"duel"); }
  if(d.t==="ambushed"&&d.victim===me.id){ toast(`⚔️ ${String(d.h).slice(0,18)} ambushed you${d.won?" and robbed you":""}! ${d.won?"":"You fought them off."}`); sfx("crunch"); } }
function acceptDuel(){ const a=duelAsks[0]; if(!a) return; duelAsks=[]; room.emit("duel",{t:"yes",to:a.peer,uid:me.id,h:S.handle}).catch(()=>{}); startPvp(a.uid,"duel"); }
function startPvp(uid2,kind){
  const p=players[uid2]; if(!p||!p.keeper){ toast("They slipped away."); return; } if(B||RUN) return;
  const o={id:uid2,handle:p.handle,rating:p.rating||1000,team:p.team||[],keeper:p.keeper,real:true,purse:p.purse||0,mark:p.mark||0};
  const foes=[]; if(o.keeper&&ARCH[o.keeper.arch]) foes.push(mkKeeper("E",o.keeper)); o.team.slice(0,3).filter(t=>SPECIES[t.sp]).forEach(t=>foes.push(mkSoul("E",t)));
  beginBattle(foes,{mode:"arena",opp:o,pvp:kind,zone:zoneOf(S.loc)||ZONES[0]}); }
async function ambush(peer,uid2){
  const law=lawOf(S.loc), p=players[uid2]; if(!p) return;
  if(law==="safe"&&!marked(p)){ toast("Not here. This is safe ground."); return; }
  const note=law==="lawless"||marked(p)?"No one will judge you here.":"Ambushing here will leave a Hollow Mark on you for an hour: others can hunt you, and the Hall's Edge portal will refuse you.";
  if(!(await ask(`Ambush ${p.handle}? ${note}`,"Ambush"))) return;
  if(law==="contested"&&!marked(p)){ S.mark=Date.now()+60*60000; saveSoon(); setDoing(); }
  startPvp(uid2,"ambush"); }

/* ============ LIVE CONTENT (from the Rift Keepers Builder) ============
   The Builder saves changes on the server. When the game starts, it asks for them and layers them on top of the built-in data:
   edits to existing things (renames, stats, descriptions, map positions) and new data-only additions. */
let CONTENT_VERSION=null;
function applyContent(c){ if(!c) return;
  Object.entries(c.moves||{}).forEach(([id,f])=>{ MOVES[id]={...(MOVES[id]||{t:"dmg",p:30,el:null}),...f}; });
  Object.entries(c.items||{}).forEach(([id,f])=>{ ITEMS[id]={...(ITEMS[id]||{ico:"❔",d:"",cat:"junk"}),...f}; });
  Object.entries(c.weapons||{}).forEach(([id,f])=>{ WEAPONS[id]={...(WEAPONS[id]||{t:"greatsword",r:"common",price:50}),...f}; if(f.r==="mythic"){ WEAPONS[id].hidden=true; WEAPONS[id].lore=WEAPONS[id].lore||WEAPONS[id].d; } });
  Object.entries(c.species||{}).forEach(([id,f])=>{ const base=SPECIES[id]||{id,kind:"soul",el:"stone",r:"common",art:"❔",hp:50,atk:12,def:12,spd:12,lore:"",moves:["tackle","harden"]}; SPECIES[id]={...base,...f,id}; });
  Object.entries(c.areas||{}).forEach(([id,f])=>{ const z=ZONES.find(x=>x.id===id); if(!z) return; Object.assign(z,f); if(f.lvMin||f.lvMax) z.lv=[f.lvMin||z.lv[0],f.lvMax||z.lv[1]]; });
  Object.entries(c.map||{}).forEach(([id,f])=>{ if(MAPN[id]) Object.assign(MAPN[id],f); });
  Object.entries(c.stories||{}).forEach(([area,list])=>{ (list||[]).forEach(ch=>{ CHAINS[area]=CHAINS[area]||[]; const i=CHAINS[area].findIndex(x=>x.id===ch.id); if(i>=0) CHAINS[area][i]=ch; else CHAINS[area].push(ch); }); });
}
// A snapshot of the editable game data, used by the Builder as its starting point.
function exportContentBase(){ const pick=(o,keys)=>Object.fromEntries(keys.filter(k=>o[k]!==undefined).map(k=>[k,o[k]]));
  return { version:APP_VERSION,
    types:Object.fromEntries(Object.entries(TYPES).map(([k,t])=>[k,{name:t.name,c:t.c,ico:t.ico}])),
    species:Object.fromEntries(Object.values(SPECIES).filter(s=>s.kind==="soul"||s.kind==="hero").map(s=>[s.id,pick(s,["n","el","r","art","hp","atk","def","spd","lore","moves","kind"])])),
    moves:Object.fromEntries(Object.entries(MOVES).filter(([k])=>!k.startsWith("atk_")).map(([k,m])=>[k,pick(m,["n","el","t","p","hits","delay","haste","taunt","tag"])])),
    weapons:Object.fromEntries(Object.entries(WEAPONS).map(([k,w])=>[k,pick(w,["n","t","r","skill","d","price","zone","lore"])])),
    weaponTypes:Object.fromEntries(Object.entries(WEAPON_TYPES).map(([k,t])=>[k,{n:t.n,ico:t.ico}])),
    items:Object.fromEntries(Object.entries(ITEMS).map(([k,i])=>[k,pick(i,["n","ico","d","cat","text"])])),
    areas:Object.fromEntries(ZONES.map(z=>[z.id,{n:z.n,d:z.d,lvMin:z.lv[0],lvMax:z.lv[1],pool:z.pool,min:z.min}])),
    map:Object.fromEntries(Object.entries(MAPN).map(([k,m])=>[k,{x:m.x,y:m.y,ico:m.ico,n:nodeName(k)}])),
    edges:MAPE,
    stories:Object.fromEntries(Object.entries(CHAINS).map(([k,v])=>[k,v])) }; }

function makeOnlineDB(){

  const poll=(path,fn,err)=>{ let stop=false, t=null; const run=async()=>{ if(stop) return; if(!document.hidden){ try{ await fn(); }catch(e){ if(err) err(e); } } t=setTimeout(run,window.TK_POLL||(SLOW.test(path)?30000:6000)); }; run(); return ()=>{ stop=true; clearTimeout(t); }; };
  const snapDocs=items=>({docs:(items||[]).map(it=>({id:it.id,data:()=>it.data})),empty:!(items||[]).length});
  const docRef=path=>{ const i=path.lastIndexOf("/"), cp=path.slice(0,i), id=path.slice(i+1); const one=async()=>{ const r=await call("get",{path:cp,id}); return {id,exists:!!r.item,data:()=>r.item}; };

  const coll=(path,q={})=>{ if(path==="chat"||path==="roles"||path==="bans"||path==="mutes"||path==="reports") return {onSnapshot:()=>()=>{},where:()=>coll(path,q),orderBy:()=>coll(path,q),limit:()=>coll(path,q),add:async()=>({id:""}),doc:docRef,get:async()=>snapDocs([])};
    const list=async()=>snapDocs((await call("list",{path,...q})).items);
    return {add:async d=>({id:(await call("add",{path,data:d})).id}),doc:id=>docRef(path+"/"+id),where:(f,op,v)=>coll(path,{...q,where:[f,op,v]}),orderBy:(f,dir)=>coll(path,{...q,orderBy:[f,dir||"asc"]}),limit:n=>coll(path,{...q,limit:n}),get:list,onSnapshot:(cb,err)=>poll(path,async()=>cb(await list()),err)}; };
  return {collection:coll,doc:docRef};
}

  if(ONLINE){ try{ await nkRpc("report",{kind,target,text,context:ctx.slice(0,500)}); toast("Thank you. The team will look at it."); return true; }catch(e){ toast(await nkReadErr(e)); return false; } }
  if(db){ try{ await db.collection("reports").add({kind,target:target||null,text:text.slice(0,1500),context:ctx.slice(0,500),by:me.id,bh:S.handle,status:"open",at:Date.now()}); toast("Thank you. The team will look at it."); return true; }catch(e){ toast("Couldn't send that."); return false; } }
  toast("Reports need a connection to the Hall."); return false; }
function reportDialog(kind,target,label){ const o=document.createElement("div"); o.className="ask";
  const titles={player:"Report a player",message:"Report a message",bug:"Report a bug",feedback:"Send feedback"};
  o.innerHTML=`<div class="in" style="text-align:left"><b>${titles[kind]}</b>${label?`<p class="meta" style="margin:6px 0">${esc(label)}</p>`:""}<textarea id="rpT" rows="4" maxlength="1500" style="width:100%;box-sizing:border-box" placeholder="${kind==="bug"?"What happened, and what were you doing?":kind==="feedback"?"What do you like, what's confusing, what's missing?":"What's wrong?"}"></textarea>
   <div class="row"><button class="btn" data-no>Cancel</button><button class="btn gold" data-yes>Send</button></div></div>`;
  document.body.appendChild(o); o.querySelector("textarea").focus();
  o.querySelector("[data-no]").onclick=()=>o.remove(); o.querySelector("[data-yes]").onclick=async()=>{ if(await sendReport(kind,target,o.querySelector("textarea").value,label)) o.remove(); }; }

/* ============ THE CHEST (in your Hall of Worlds door) ============

const CHEST_PRICE=150, CHEST_SLOTS=80;
const CHEST_CATS=[["items","Items","🎒"],["weapons","Weapons","⚔️"],["armor","Armor","🛡️"],["notes","Notes","📜"],["skills","Skills","📖"],["unknown","Unknown","❔"]];
function itemCat(id){ const it=ITEMS[id]; if(!it) return "unknown"; if(it.cat==="armor") return "armor"; if(it.text&&it.teach) return "skills"; if(it.text) return "notes";
  if(["tool","herb","fish","ore","potion","meal","junk"].includes(it.cat)) return "items"; return "unknown"; }
let chestTab="items";
function chestUsed(){ const c=S.chest; if(!c) return 0; return Object.values(c.items||{}).reduce((a,n)=>a+n,0)+(c.weapons||[]).length; }
function chestHTML(){ if(!S.chest) return `<div class="admin-sec" style="margin-top:12px"><h3>📦 A chest</h3><p class="meta">A sturdy chest for your door. Things kept in it are safe, sorted, and waiting whenever you come home.</p>
    <button class="btn gold" id="chBuy" ${S.coins<CHEST_PRICE?"disabled":""}>Buy a chest (${CHEST_PRICE} 🪙)</button></div>`;
  const c=S.chest, tabs=CHEST_CATS.map(([k,n,ico])=>{ const cnt=k==="weapons"?(c.weapons||[]).length:Object.entries(c.items||{}).filter(([id,v])=>v>0&&itemCat(id)===k).reduce((a,[,v])=>a+v,0); return `<button role="tab" aria-selected="${chestTab===k}" data-ct="${k}">${ico} ${n} <small>${cnt}</small></button>`; }).join("");
  let inside="", mine="";

    mine=(S.weapons||[]).filter(w=>w.u!==S.weapon).map(w=>`<div class="srow"><span>${wIco(w.id)} ${esc(W(w.id).n)} ${rarChip(W(w.id).r)}</span><button class="btn" data-cwin="${w.u}">Store</button></div>`).join(""); }
  else { inside=Object.entries(c.items||{}).filter(([id,n])=>n>0&&itemCat(id)===chestTab).map(([id,n])=>`<div class="srow"><span>${icoOf(id)} ${esc(ITEMS[id].n)}${n>1?" ×"+n:""}</span><button class="btn" data-ciout="${id}">Take</button></div>`).join("");
    mine=Object.entries(S.bag).filter(([id,n])=>n>0&&ITEMS[id]&&itemCat(id)===chestTab&&ITEMS[id].cat!=="tool").map(([id,n])=>`<div class="srow"><span>${icoOf(id)} ${esc(ITEMS[id].n)}${n>1?" ×"+n:""}</span><button class="btn" data-ciin="${id}">Store</button></div>`).join(""); }

   <div class="cavegrid"><div><h4 style="margin:4px 0">In the chest</h4>${inside||`<p class="empty">${empty}</p>`}</div><div><h4 style="margin:4px 0">On you</h4>${mine||`<p class="empty">${chestTab==="weapons"?"Nothing to store (your equipped weapon stays with you).":"Nothing of this kind on you."}</p>`}</div></div></div>`; }
function bindChest(){
  const b=$("#chBuy"); if(b) b.onclick=async()=>{ if(S.coins<CHEST_PRICE) return; if(!(await ask(`Buy a chest for your door for ${CHEST_PRICE} coins?`,"Buy"))) return; spend(CHEST_PRICE,"spend"); S.chest={items:{},weapons:[]}; sfx("seal"); toast("A chest is carried in and set down by the wall."); saveSoon(); render(); };
  document.querySelectorAll("[data-ct]").forEach(t=>t.onclick=()=>{ chestTab=t.dataset.ct; render(); });
  document.querySelectorAll("[data-ciin]").forEach(x=>x.onclick=()=>{ if(chestUsed()>=CHEST_SLOTS){ toast("The chest is full."); return; } const id=x.dataset.ciin; if(!(S.bag[id]>0)) return; S.bag[id]--; if(S.bag[id]<=0) delete S.bag[id]; S.chest.items[id]=(S.chest.items[id]||0)+1; saveSoon(); render(); });
  document.querySelectorAll("[data-ciout]").forEach(x=>x.onclick=()=>{ const id=x.dataset.ciout; if(!(S.chest.items[id]>0)) return; S.chest.items[id]--; if(S.chest.items[id]<=0) delete S.chest.items[id]; giveItem(id); saveSoon(); render(); });

/* ============ WORLD MAP ============ */
const MAPN={
 town:{n:"Hall's Edge",x:500,y:545,d:"The last town before the Hall of Worlds. Its great portal cracked long ago and never took anyone anywhere again. It still hums.",ico:"🏰"},
 meadow:{x:500,y:405,ico:"🌼"}, emberwood:{x:235,y:300,ico:"🔥"}, shallows:{x:770,y:300,ico:"🌊"}, riftscar:{x:500,y:118,ico:"🌀"}
};
const MAPE=[["town","meadow"],["meadow","emberwood"],["meadow","shallows"],["emberwood","riftscar"],["shallows","riftscar"]];
const EDGE_PATH={"town-meadow":"M500 545 Q470 480 500 405","meadow-emberwood":"M500 405 Q360 400 235 300","meadow-shallows":"M500 405 Q650 400 770 300","emberwood-riftscar":"M235 300 Q260 150 500 118","shallows-riftscar":"M770 300 Q740 150 500 118"};
const PORTAL_TXT={meadow:"A broken portal leans in the long grass, wildflowers growing through its ring.",emberwood:"A broken portal, scorched black, still warm at its heart.",shallows:"A broken portal half under the water. Fish swim through it and come out the same fish.",riftscar:"A broken portal floating a hand's width off the ground. It shouldn't be here."};
let mapSel=null, travelling=false, panelTab="here", CHAT_DRAFT="", CHAT_POP_LOC=null;
function zoneOf(id){ return ZONES.find(z=>z.id===id)||(typeof ISLE_Z!=="undefined"?ISLE_Z.find(z=>z.id===id):null); }
function isWorld(id){ return ["hall","night","clock","star","court","deep","tidew"].includes(id); }
function mapAreaKnown(id){ return S.loc===id||!!(S.portals||{})[id]; }
function mapAreaVisible(id){return mapAreaKnown(id)||neighbours(S.loc).includes(id);}
function mapAreaLabel(id){if(mapAreaKnown(id))return nodeName(id);const a=MAPN[S.loc],b=MAPN[id];if(!a||!b)return 'Unexplored path';if(layerOf(id)!==layerOf(S.loc))return 'Unexplored doorway';const dx=b.x-a.x,dy=b.y-a.y;const dirs=['east','south-east','south','south-west','west','north-west','north','north-east'];return 'Unexplored path · '+dirs[(Math.round(Math.atan2(dy,dx)/(Math.PI/4))+8)%8];}
function edgePath(a,b){ if(EDGE_PATH[a+"-"+b]) return EDGE_PATH[a+"-"+b]; const A=MAPN[a],Bn=MAPN[b]; const mx=(A.x+Bn.x)/2+(Bn.y-A.y)*.12, my=(A.y+Bn.y)/2-(Bn.x-A.x)*.12; return `M${A.x} ${A.y} Q${Math.round(mx)} ${Math.round(my)} ${Bn.x} ${Bn.y}`; }
function nodeName(id){ return id==="town"?MAPN.town.n:(zoneOf(id)||{}).n||id; }
function atPortal(){ return !RUN&&!B&&!!(S.portals||{})[S.loc]; }
function mapPath(a,b){ const q=[[a]],seen={[a]:1}; while(q.length){ const p=q.shift(), n=p[p.length-1]; if(n===b) return p;
  MAPE.forEach(([x,y])=>{ const m=x===n?y:y===n?x:null; if(m&&!seen[m]){ seen[m]=1; q.push([...p,m]); } }); } return [a]; }
function gateSpots(){ return Object.entries(S.gates||{}).slice(-18).map(([k,v])=>{ const run=GATES[k]||DBGATES[k]; const base=run?run.base:(v.w?genGateRun(v.w).z:"meadow"); const c=MAPN[base]||MAPN.meadow;
  const h=parseInt(k.slice(-6),36)||1, a=(h%360)*Math.PI/180, r=62+(h%30); return {k,v,base,x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r*.7,done:!!S.gateDone[k],hand:!!run}; }); }
let mapLayer=null;
const LAYER_VB={near:"0 30 1000 600",hall:"0 640 1000 600"};
/* The map band is short and wide, so a fixed 1000×600 box letterboxes into the middle with
   dead borders either side. Widen the view to the band's own shape instead — nothing is
   cropped, the extra width is open sea — so the map fills its area edge to edge. */
function fitMapView(){
  const svg=document.querySelector(".wmap"); if(!svg) return;
  const r=svg.getBoundingClientRect(); if(r.width<20||r.height<20) return;
  const b=(LAYER_VB[curLayer()]||LAYER_VB.near).split(" ").map(Number);
  const ar=r.width/r.height;
  // Widen the view to the shape of the box so the map fills it, but only so far: past about
  // 2.2:1 the island would just sit in a sea of nothing. Never crop vertically — the peaks at
  // the top and the Hall of Worlds door at the bottom have to stay on screen.
  const w=Math.max(b[2],Math.min(b[3]*ar,b[2]*1.32));
  svg.setAttribute("viewBox",`${(500-w/2).toFixed(1)} ${b[1]} ${w.toFixed(1)} ${b[3]}`);
}
addEventListener("resize",()=>{ if(view==="hunt") requestAnimationFrame(fitMapView); });

function areaWeather(id,m){

}
let mapWeatherCleanup=null;
function stopMapWeather(){if(mapWeatherCleanup){mapWeatherCleanup();mapWeatherCleanup=null;}}
function bindMapWeather(){
  stopMapWeather();const map=document.querySelector('.wmap');if(!map)return;
  const reduced=RM||SET.motion==='reduced'||matchMedia('(prefers-reduced-motion: reduce)').matches;
  map.classList.toggle('weather-disabled',SET.mapWeather===false);map.classList.toggle('weather-still',reduced);
  if(SET.mapWeather===false||reduced)return;
  const storms=[...map.querySelectorAll('.area-weather.storm')].filter(el=>layerOf(el.dataset.weather)===curLayer());
  if(!storms.length)return;
  let next=0,clear=0,sound=0,active=null,stopped=false,last=-1;
  const schedule=()=>{next=setTimeout(strike,9000+Math.random()*7000);};
  const strike=()=>{
    if(stopped||!map.isConnected)return;
    if(document.hidden){schedule();return;}
    let i=Math.floor(Math.random()*storms.length);if(i===last&&storms.length>1)i=(i+1)%storms.length;last=i;
    active=storms[i].closest('.mnode');active.classList.add('weather-striking');
    sound=setTimeout(()=>{if(!stopped&&map.isConnected&&!document.hidden)sfx('mapThunder',.15);},420);
    clear=setTimeout(()=>{active?.classList.remove('weather-striking');active=null;},1900);schedule();
  };
  mapWeatherCleanup=()=>{stopped=true;clearTimeout(next);clearTimeout(clear);clearTimeout(sound);active?.classList.remove('weather-striking');};
  next=setTimeout(strike,3200+Math.random()*2400);
}

     <p>${esc(r.goal)}</p><div class="mininodes">${r.nodes.map(n=>NODE_ICO[n.t]).join("")}</div>
     <div class="row"><span style="color:var(--muted);font-size:.85rem">🪙 ${r.reward} bonus</span><button class="btn gold" onclick="startRun('${z.id}','${r.id}')" ${RUN?"disabled":""}>Start</button></div></div>`).join("")}</div>`;
  return `${head}${tabs}<div class="ppane ${tab==="chat"?"chatpane":""}">${tab==="runs"?paneRuns:tab==="chat"?paneChat:tab==="people"?people||'<p class="meta">Nobody else is here right now.</p>':paneHere}</div>`;

function animHop(a,b){ return new Promise(res=>{

  let len=0; try{ len=el.getTotalLength(); }catch(e){} if(!len){ res(); return; }
  const t0=performance.now(), dur=1000;
  const step=t=>{ const k=Math.min(1,(t-t0)/dur), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2, pt=el.getPointAtLength(len*(rev?1-e:e));

// Timing mini-game rules:
// · Regular attacks: a random chance (25%) to get a critical window. Hit it = a critical. Miss = a normal hit.
// · Skills (every ability with an energy, and every companion skill): the window always appears.
//   Each skill has its own sweet spot on the bar, and the window widens as that skill ranks up (or the companion levels).
// Always upside-only: missing never makes a move weaker than normal.
const REGULAR=new Set(["kstrike",...Object.keys(MOVES).filter(k=>k.startsWith("atk_"))]);

function skillSpot(mk){ let h=0; for(const c of String(mk)) h=(h*31+c.charCodeAt(0))>>>0; return .22+(h%600)/1000; } // each skill's own section, 0.22–0.82

function captureUses(){ return Math.max(0,captureCapacity()-Math.max(0,Number(S.captureSpent)||0)); }

/* Charged Soul Capture — one button, held.

async function mgSoulCharge(u,t,payment){
  mgStart(); const battle=B;
  if(KEYHELD.c||KEYHELD[' ']||KEYHELD.Enter) MGI.action=1;
  const cost=payment.kind==='use'?`${captureUses()} of ${captureCapacity()} left`:payment.kind==='health'?`costs ${captureHealthCost(u)} health`:'costs a companion’s strength';
  const pad=document.body.classList.contains('pad');
  const hint=pad?'Hold <b>A</b> or <b>RT</b> · <b>B</b> backs out':'Hold <b>C</b>, <b>Space</b> or the ring · <b>Esc</b> backs out';
  const R=46, C=2*Math.PI*R;
  const o=mgOverlay(`Soul Capture · ${esc(t.name)}`,`<p class="meta" style="margin:0 0 8px">${cost}</p>
    <button class="capring" data-hold="action" aria-label="Hold to reach for the soul">
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${R}" class="cr-track"/><circle cx="60" cy="60" r="${R}" class="cr-band" id="crBand"/><circle cx="60" cy="60" r="${R}" class="cr-fill" id="crFill"/></svg>
      <span class="cr-core" id="crCore">${unitArtHTML(t,'ok')||'✦'}</span></button>
    <p id="crMsg" class="cr-msg" aria-live="polite">Hold, and let go inside the light.</p>

    <div class="row" style="justify-content:center;margin-top:6px"><button class="btn" id="crBack">Cancel</button></div>`);
  o.classList.add('capcharge');

  const fill=o.querySelector('#crFill'), band=o.querySelector('#crBand'), core=o.querySelector('#crCore'), msg=o.querySelector('#crMsg');
  const tEl=pEl(t.id);
  // band width grows gently with the Keeper profession; the pull is quicker on rarer souls
  const soul=SPECIES[t.soul||t.sp]||SPECIES[t.sp], rare={common:0,uncommon:.1,rare:.2,epic:.35,legendary:.5,mythic:.6}[soul.r]||.2;
  const w=Math.min(.26,.18+profLv("keeper")*.002), speed=.5, sway=.8+rare*.9;
  let ch=0, held=false, clock=0, idle=0, lastTick=0;

async function mgSoulTug(t){

let padLast={};
function padLoop(t){
  if(MG_ON){ requestAnimationFrame(padLoop); return; }
  const gp=[...(navigator.getGamepads?navigator.getGamepads():[])].find(g=>g&&g.connected);
  if(gp){
    const pressed=gp.buttons.map(b=>b.pressed||b.value>.5);
    pressed.forEach((p,i)=>{ if(p&&!padPrev[i]&&i<12){ if(t-(padLast[i]||0)>120){ padLast[i]=t; padPress(i); } } });
    // stick: a real push (past 0.65) counts once; holding it repeats slowly; it must come back under 0.4 before it counts again
    const pointerMode=window.RKNavigation?.frame(gp,t); const ax=pointerMode?0:(gp.axes[0]||0), ay=pointerMode?0:(gp.axes[1]||0), ON=.65, OFF=.4;
    const stick={u:ay<-ON,d:ay>ON,l:ax<-ON,r:ax>ON}, stickOff={u:ay>-OFF,d:ay<OFF,l:ax>-OFF,r:ax<OFF};
    const dirs={u:pressed[12]||stick.u,d:pressed[13]||stick.d,l:pressed[14]||stick.l,r:pressed[15]||stick.r};
    Object.entries(dirs).forEach(([k,on])=>{
      if(!on){ if(stickOff[k]&&!pressed[{u:12,d:13,l:14,r:15}[k]]) delete padRep[k]; return; }
      const due=padRep[k]; if(due===undefined||t>=due){ padRep[k]=t+(due===undefined?450:170);
        padDir(k==="l"?-1:k==="r"?1:0,k==="u"?-1:k==="d"?1:0); } });
    if(!window.RKNavigation?.rightStickReserved)window.RKBattleViewport?.pan(gp.axes[2]||0);
    const ry=gp.axes[3]||0; if(!window.RKNavigation?.rightStickReserved&&Math.abs(ry)>.35){ const m=view==="social"?$("#chat"):$("#main"); if(m) m.scrollTop+=(ry-Math.sign(ry)*.35)*22; }
    padPrev=pressed;
  } else { padPrev=[]; padRep={}; padLast={}; }
  requestAnimationFrame(padLoop);
}

  M("hiddensouls",!!(S.st&&S.st.hiddenSouls),"Souls in Borrowed Bodies",["Not every creature carries its own soul. Now and then, the soul you pull out belongs to something else entirely. Those with strong Lantern-Sight can sometimes feel the mismatch before they reach in."]);

function codexCheck(quiet){ if(!S||!S.handle) return; S.codexSeen=S.codexSeen||{}; const fresh=codexEntries().filter(e=>!S.codexSeen[e.id]);

  if(id.startsWith("place:")||id.startsWith("origin:")) return (MAPN[k]||{}).ico||"🌍"; if(id.startsWith("gate:")) return "🌀";

const CODEX_TABS=[["souls","Companions"],["places","Places"],["worlds","Worlds"],["people","People"],["quests","Quests"],["arms","Weapons"],["recipes","Recipes"],["lore","Letters & books"],["mysteries","Mysteries"]];

  const det=sel?`<article class="cxdet cxpage" key="${esc(sel.id)}"><div class="cxsub">${esc(sel.sub||"")}${sel.addr?` · <span class="addr">${sel.addr}</span>`:""}</div><h3>${esc(sel.n)}</h3>

function gateRows(){
  const rows=[]; const built=gateNotes();

  Object.entries(DBGATES).forEach(([k,g])=>{ const n=gateNotesDb[k]||{}; rows.push({k,t:g.title,p:n.p||"(words not on this device)",i:n.i||g.item||"",db:true}); });
  return rows.map(r=>{ const f=firsts["gate_"+r.k]; return `<tr><td><b>${esc(r.t)}</b>${r.db?"":" <small class='meta'>built-in</small>"}</td><td>${esc(r.p)}</td><td>${r.i?esc((ITEMS[r.i]||{}).n||r.i):"—"}</td><td>${f?esc(f.handle||"?"):"<span class='meta'>Nobody yet</span>"}</td>
    <td>${r.db?`<button class="btn" data-delgate="${esc(r.k)}">Delete</button>`:""}</td></tr>`; }).join("");
}

    else if(t==="master"){ SKILLS.forEach(k=>{ for(let i=0;i<10;i++) trainSkill(k,skillNeed(S.skills[k].lv)); }); }
    else if(t==="weapons") Object.keys(allWeapons()).forEach(id=>{ if(!S.weapons.some(w=>w.id===id)) giveWeapon(id); });
    else if(t==="restore"){ S.restored=true; }
    else if(t==="flask"){ S.flaskMax++; S.flasks=S.flaskMax; }
    else if(t==="portals") Object.keys(MAPN).forEach(k=>S.portals[k]=true);
    else if(t==="words") ALL_WORDS.forEach(w=>{ if(!S.words.includes(w)) S.words.push(w); });
    else if(t==="items") Object.keys(ITEMS).forEach(id=>giveItem(id));
    else if(t==="book") Object.values(SPECIES).forEach(x=>{ S.seen[x.id]=true; if(x.kind==="soul") S.caught[x.id]=true; });
    else if(t==="heal"){ if(RUN){ Object.keys(RUN.hp).forEach(k=>RUN.hp[k]=1); } }

function applyGifts(list){
  let changed=false;
  list.forEach(({id,g})=>{ if(S.claimed[id]||!S.handle) return; S.claimed[id]=true; changed=true;
    const bits=[]; if(g.coins){ earn(g.coins,"gift"); bits.push(g.coins+" coins"); } if(g.tonics){ S.tonics+=g.tonics; bits.push(g.tonics+" tonics"); }
    if(g.title&&SECRET_BY[g.title]){ earnSecret(g.title,true); bits.push("the title "+(SECRET_BY[g.title].n||"")); }
    if(g.sp&&SPECIES[g.sp]){ addMon(g.sp,g.lv||5,{tint:g.tint||"meadow",nt:!!g.nt}); bits.push((g.nt?"a Nothing-touched ":"")+SPECIES[g.sp].n); }
    toast(`A gift from the Hall: ${bits.join(", ")}${g.note?` · “${g.note}”`:""}`); });
  if(changed){ saveSoon(); render(); }
}
