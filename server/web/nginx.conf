map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;

  # The client resolves relative paths from the site root, so /play must not redirect to /play/.
  location = /play { try_files /play/index.html =404; }
  location = /play/ { return 301 /play; }

  # Nakama API, realtime socket and health on the same origin.
  location /v2/ {
    proxy_pass http://nakama:7350;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location = /ws {
    proxy_pass http://nakama:7350;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 1h;
  }
  location = /healthcheck { proxy_pass http://nakama:7350; }

  # Round-2 shared play, served by the mmo bridge (Nakama sign-in required).
  location ^~ /mmo/ {
    proxy_pass http://mmo:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    client_max_body_size 8k;
  }
  # Accounts and cloud saves are Nakama's now.
  location ^~ /account/ { default_type application/json; return 503 '{"error":"Your account and cloud save now live on the Hall itself. Sign in from the title screen."}'; }
  location = /client-update { default_type application/json; return 204; }

  # Player access is open; the client polls this.
  location = /launch-status { default_type application/json; return 200 '{"open":true}'; }

  location ~* \.(json|webmanifest)$ { add_header Cache-Control "no-store"; }
  location ~* \.(html|js|css)$ { add_header Cache-Control "no-cache"; }
  location / { try_files $uri $uri/ =404; }
}
