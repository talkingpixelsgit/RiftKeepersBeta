# Builds the Rift Keepers Windows installer (desktop/). Unsigned; the installer is a workflow artifact.
name: Rift Keepers for Windows
on:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-windows.yml'
  push:
    tags:
      - 'desktop-v*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d
        with:
          toolchain: stable
      - name: Install the Tauri command line
        run: npm ci
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build the installer
        run: npx tauri build
      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: rift-keepers-windows-${{ github.run_number }}
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
